# Project 3, kernel trimming for the 20-kernel-trim variant.
#
# THIS FILE IS DELIBERATELY EMPTY OF SYMBOLS UNTIL PROJECT 2 EXISTS.
#
# The method is localmodconfig against an lsmod captured from a reference
# boot, followed by manual removal. Both produce a symbol list that is a
# property of one kernel tree and one board, and writing a plausible list
# here in advance would be a guess presented in the same voice as a
# measurement. This repository has made that mistake once already and it
# cost a machine change, three figures and four documents.
#
# The procedure, so that the file can be filled in without rereading the
# section:
#
#   on the board, after a boot with everything that matters active:
#       lsmod > /tmp/lsmod.txt
#   on the host, in the kernel tree:
#       make LSMOD=lsmod.txt localmodconfig
#       make menuconfig
#
# Candidates named by the section: sound, video, USB gadget, most
# filesystems, CONFIG_DEBUG_INFO, CONFIG_IKCONFIG, CONFIG_KALLSYMS_ALL.
#
# KEEP built in: the eMMC driver, ext4 and the pin controller. The root
# filesystem is mounted directly by PARTUUID and there is no initramfs, so
# a modular MMC stack means a rootwait that cannot complete.
#
# WARNING about localmodconfig: it removes drivers for anything that was
# not loaded during the reference boot. Capture lsmod from a boot with the
# Wi-Fi up and the console attached, or the optimised kernel loses them.
