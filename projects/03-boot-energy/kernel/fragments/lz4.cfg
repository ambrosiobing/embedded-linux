# Project 3, compression variant: LZ4.
#
# One of three, measured against each other in 21-kernel-lz4 and its
# siblings. Which one wins is not predictable from first principles and
# that is the point of measuring it: loading from eMMC favours the smallest
# image, decompressing on a Cortex-A7 favours LZ4, and the two effects pull
# in opposite directions.
CONFIG_KERNEL_LZ4=y
