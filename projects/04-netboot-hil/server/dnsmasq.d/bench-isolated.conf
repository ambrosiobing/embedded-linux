# The lab network: one cable, two hosts, no router.
#
# This is the topology this bench actually uses. There is no wired modem
# here, so the server is the DHCP server rather than a proxy, and
# 192.168.7.0/24 is an island: no default route is offered and no DNS, which
# is why the two dhcp-option lines below are empty rather than absent.
#
# The server's Wi-Fi is untouched by any of this. That is how a human
# reaches the server at all, and losing it means walking over with a
# keyboard.

# No DNS. dnsmasq is a DHCP and TFTP server here and nothing else. Without
# this it would also bind port 53 on every interface, which on a machine
# whose other interface is somebody's phone hotspot is rude at best.
port=0

# Only the lab cable. bind-interfaces rather than the default wildcard bind,
# so that nothing here is offered on the Wi-Fi side.
interface=eth0
bind-interfaces

dhcp-range=192.168.7.10,192.168.7.20,12h

# Deliberately empty: no router and no DNS server on this island. An empty
# option is not the same as an absent one. Absent means the client uses its
# own default, and a DUT that thinks it has a route to the internet takes
# thirty seconds to find out otherwise at every boot.
dhcp-option=3
dhcp-option=6

# The boot ROM looks for this exact string in option 43 and ignores an
# offer without it. Very old bootcode versions wanted three trailing
# spaces; if the ROM ignores a well-formed offer, that is the first thing
# to check with "tcpdump -v -i eth0 port 67".
pxe-service=0,"Raspberry Pi Boot"

enable-tftp
tftp-root=/srv/tftp

# Every DHCP transaction in the journal. This is the single most useful
# line in the file: almost every failure in this project is diagnosed by
# reading "journalctl -fu dnsmasq" while the DUT powers on.
log-dhcp
