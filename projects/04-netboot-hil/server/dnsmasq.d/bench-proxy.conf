# The other topology: both boards plugged into a real router.
#
# Not used on this bench, which has no wired modem, and kept because it is
# the arrangement most people will have and because the difference between
# the two files is itself worth reading.
#
# In proxy mode the router hands out addresses as usual and dnsmasq adds
# only the boot options to the offer. That means dnsmasq must be on the same
# broadcast domain as the DUT: a Wi-Fi access point that filters broadcasts
# between wireless and wired clients breaks it silently, which is why the
# server belongs on the cable in this topology rather than on Wi-Fi.
#
# Install exactly one of these two files, never both.

port=0
interface=eth0
bind-interfaces

# The magic word. "proxy" means: answer with boot options only, leave the
# address to whatever real DHCP server is on the wire. Set the address to
# the broadcast address of the subnet the router serves.
dhcp-range=192.168.1.255,proxy

pxe-service=0,"Raspberry Pi Boot"

enable-tftp
tftp-root=/srv/tftp

# Optional: serve a different directory per MAC address, which is how this
# scales to a second DUT without renaming anything.
#tftp-unique-root=mac

log-dhcp
