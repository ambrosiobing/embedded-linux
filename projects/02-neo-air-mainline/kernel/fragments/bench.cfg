# Project 2: mainline kernel options on top of sunxi_defconfig.
#
# Merged with scripts/kconfig/merge_config.sh, never by editing a .config.
#
# sunxi_defconfig already selects the platform (CONFIG_ARCH_SUNXI), the SD
# and eMMC host (CONFIG_MMC_SUNXI), the pin controller
# (CONFIG_PINCTRL_SUN8I_H3) and the console UART
# (CONFIG_SERIAL_8250_DW). None of those are repeated here. A fragment that
# restates the defconfig is a fragment nobody can read for its intent.

# --- Wi-Fi: the AP6212 on SDIO, which is mmc1 ---------------------------
#
# The chip is a BCM43430 behind SDIO, and three things have to be true for
# it to appear. This fragment supplies the first two; the third is a
# firmware file and is not a kernel option, which is exactly why it is the
# failure people spend an evening on.
#
# The reset line is toggled by an mmc-pwrseq-simple node in
# sun8i-h3-nanopi-neo-air.dts, so the power sequencer is not optional here:
# without it the SDIO bus is scanned before the chip is out of reset and
# nothing is found. There is no error, only an absent interface.
#
# The Kconfig symbol is PWRSEQ_SIMPLE, defined in drivers/mmc/core/Kconfig.
# It is NOT MMC_PWRSEQ_SIMPLE, which is what this fragment asked for on its
# first run and is not a symbol anywhere in the tree. The name that looks
# right is the device-tree compatible string, mmc-pwrseq-simple, and a
# compatible string and a Kconfig symbol are different namespaces that
# happen to read alike. kconfig does not object to a symbol it has never
# heard of: the request simply does not appear in .config, which is why
# build.sh compares what was asked for against what arrived.
CONFIG_PWRSEQ_SIMPLE=y

# sunxi_defconfig switches the entire wireless menu off:
#
#     # CONFIG_WIRELESS is not set
#
# and every option below lives inside it, so cfg80211, mac80211, brcmfmac
# and its SDIO front end were all dropped together on the first run, four
# symptoms of one cause.
#
# The header of this file says a fragment should not restate its defconfig.
# That rule is about options the defconfig already provides. A menu gate
# the defconfig has closed is the opposite case: stating it is the whole
# point of a fragment, and leaving it out makes everything under it
# unreachable in silence.
CONFIG_WIRELESS=y
CONFIG_WLAN=y
CONFIG_WLAN_VENDOR_BROADCOM=y

CONFIG_CFG80211=m
CONFIG_MAC80211=m
CONFIG_BRCMFMAC=m
CONFIG_BRCMFMAC_SDIO=y

# BRCMFMAC is a module on purpose, matching the specification, and that
# choice has a consequence that belongs in the same file as the choice:
#
#   if the root filesystem is assembled before the modules are installed,
#   /lib/modules/<version>/ is empty and Wi-Fi does not fail. It is
#   absent. No interface, no message naming the cause.
#
# rootfs/mkrootfs.sh therefore installs the modules and runs depmod -a as
# part of building the filesystem, not as a step afterwards that can be
# forgotten.

# --- what systemd needs -------------------------------------------------
# A Debian bookworm userland with systemd as PID 1 will not boot without
# these. The failure mode is a kernel that starts, mounts root, and then
# stops with systemd complaining about a missing filesystem, which reads as
# a rootfs problem rather than a kernel configuration problem.
CONFIG_CGROUPS=y
CONFIG_AUTOFS_FS=y
CONFIG_TMPFS_POSIX_ACL=y
CONFIG_INOTIFY_USER=y
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y

# --- the media this board boots from ------------------------------------
CONFIG_EXT4_FS=y

# --- timestamps on every kernel line ------------------------------------
# Project 3 measures and shortens this boot. It cannot do either from a log
# without times in it, and a boot log is captured once, at the moment the
# board first comes up, by somebody who is not thinking about Project 3.
#
# So the option is set here rather than added later: the first complete
# capture is then already usable as a baseline, and docs/bootlog-sd.txt is
# evidence for two projects instead of one.
CONFIG_PRINTK_TIME=y
