# Project 2: let the root password this image sets actually be usable.
#
# Debian ships PermitRootLogin prohibit-password, which means the password
# mkrootfs.sh asks for at build time works on the console and is refused
# over ssh. That combination is worse than either choice on its own: the
# build prompts for a credential and then quietly arranges for it not to
# work, and the failure arrives as "Permission denied, please try again"
# on a board whose only other access path is a serial cable.
#
# This board has no Ethernet and no display. When the console is
# unavailable, which happened on the first bring-up night, ssh over
# wireless is the only way in.
#
# The tradeoff is stated rather than hidden: this is a bench board on a
# private network, its password is set by hand at build time and is not in
# the repository, and the image ships with no ssh host keys and no
# authorized_keys. Anything leaving this bench should put a normal user
# with sudo here instead and set this back to prohibit-password.
#
# A drop-in rather than an edit to sshd_config, because Debian's
# sshd_config carries "Include /etc/ssh/sshd_config.d/*.conf" and a
# drop-in survives a package upgrade rewriting the main file.

PermitRootLogin yes
