# Project 2: what U-Boot's distro boot reads, on partition 1.
#
# THE PARTUUID IS A PLACEHOLDER AND IS MEANT TO BE ONE.
#
# tools/flash-emmc.sh replaces it in its bootconfig state, because the
# overlay cannot know the identity of a partition that does not exist when
# the overlay is written. Two writers on one file, deliberately, and the
# ownership table in docs/DESIGN.md says so.
#
# The placeholder is visibly impossible rather than plausible. A stale
# PARTUUID copied from a previous card boots the wrong filesystem, or drops
# to an initramfs prompt naming a device that really does exist somewhere
# else. This one cannot boot at all, and fails at the first attempt with
# the reason on the console.
#
# root= is by PARTUUID and never by device name: block device names are
# assigned in probe order, so the eMMC is mmcblk1 on some kernels and
# mmcblk2 on others.

default mainline
timeout 1

label mainline
    kernel /zImage
    fdt /sun8i-h3-nanopi-neo-air.dtb
    append console=ttyS0,115200 root=PARTUUID=FILLED-BY-FLASH-EMMC rootwait rw
