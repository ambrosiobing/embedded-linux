# Project 15: the LTE router.
#
#   kas build kas/bench-router.yml        or  ./go router
#
# A separate configuration rather than a change to bench-rpi4.yml, for the
# reason stated in the repository README: a project that needs a different
# kernel or a different image adds its own kas file next to the others. The
# shared one stays the thing every project can still build.
header:
  version: 14
  includes:
    - bench-rpi4.yml

target: bench-router-image

repos:
  # ModemManager, NetworkManager, libqmi, dnsmasq and nftables all live in
  # meta-networking. It is a second layer from the same repository that is
  # already pinned in bench-rpi4.yml, so the branch is pinned there too and
  # this file only names the layer.
  meta-openembedded:
    layers:
      meta-oe:
      meta-networking:
      meta-python:

local_conf_header:
  router: |
    # Three things this project needs that the NetworkManager recipe does
    # not build by default. Its PACKAGECONFIG ??= line is
    #
    #   readline nss ifupdown dnsmasq nmcli vala systemd
    #   + bluez5 if bluetooth, + filter of DISTRO_FEATURES for wifi polkit ppp
    #
    # so none of the following is present unless it is asked for here.
    #
    #   wwan          builds networkmanager-wwan, which is
    #                 libnm-device-plugin-wwan.so. Without it the daemon
    #                 logs "'wwan' plugin not available; creating generic
    #                 device", there is no gsm device type at all, and the
    #                 lte profile can never bind to anything.
    #   modemmanager  passes -Dmodem_manager=true. Without it the plugin
    #                 above would have nothing to talk to.
    #   concheck      passes -Dconcheck=true. Without it the connectivity
    #                 check is compiled out, and this project's
    #                 connectivity.conf is a file nothing reads. That is
    #                 the whole of acceptance criterion 3, a dead upstream
    #                 behind a live carrier, and it fails silently.
    PACKAGECONFIG:append:pn-networkmanager = " wwan modemmanager concheck"

    # NetworkManager's crypto backend. nss is its default and costs about
    # 15 MB in the rootfs; gnutls does the same job for this image, which
    # needs crypto only for WPA key handling on the access point.
    # And no Bluetooth. poky carries "bluetooth" in DISTRO_FEATURES,
    # which switches on NetworkManager's bluez5 PACKAGECONFIG, which
    # builds the Bluetooth device plugin, which recommends BlueZ. The
    # first boot of the fixed image showed the result:
    #
    #   hciuart.service loaded failed failed Configure Bluetooth Modems
    #
    # hciuart attaches a Bluetooth controller to a UART, and on this
    # board that UART is the console. A gateway has no use for a
    # Bluetooth modem, and a failed unit at every boot trains whoever
    # reads "systemctl --failed" to ignore it.
    # One assignment, not two: ":remove" uses "=", so a second line
    # would silently replace the first and quietly put nss back.
    PACKAGECONFIG:remove:pn-networkmanager = "nss bluez5"
    PACKAGECONFIG:append:pn-networkmanager = " gnutls"

    # polkit is deliberately absent, having once been here.
    #
    # It was added on the guess that NetworkManager required it. It does
    # not: polkit governs what a non-root D-Bus caller may change, and
    # every caller on this box is root. What it did do was reach
    # NetworkManager and ModemManager through the DISTRO_FEATURES filter
    # above and pull in polkit, SpiderMonkey and ICU's locale tables, which
    # buildhistory measured at roughly 50 MB of a 237 MB rootfs.
    #
    # Adding it back is one line, and it is the right line the day a
    # non-root user needs to change a connection. See the size table in
    # projects/15-lte-router/README.md.

    # Turn on the router kernel fragment. See
    # meta-bench/recipes-kernel/linux/linux-raspberrypi_%.bbappend.
    BENCH_ROUTER_KERNEL = "1"

    # The modem is debugged in the kernel log more often than anywhere
    # else, so keep the sources of the driver that carries it.
    RM_WORK_EXCLUDE += "linux-raspberrypi bench-lte bench-router"
