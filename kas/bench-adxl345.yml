# Project 5: an IIO driver for the ADXL345, written from scratch.
#
#   kas build kas/bench-adxl345.yml        or  ./go adxl345
#
# A separate configuration for the reason in the repository README: a
# project that needs a different kernel adds its own kas file rather than
# changing the shared one. Here the kernel needs the regmap bus glue, the
# two controllers, and mainline's own ADXL345 driver as the control this
# project is measured against.
#
# It includes bench-rpi3.yml rather than bench-rpi4.yml because this is a
# Pi 3 project, and that file already says so in its own first line:
# "Projects 5, 6 and 19 use the identical rootfs on a Raspberry Pi 3".
# raspberrypi3-64 is the whole BCM2837 family in meta-raspberrypi, so it
# covers the 3B and the 3B+ alike.
header:
  version: 14
  includes:
    - bench-rpi3.yml

target: bench-adxl345-image

local_conf_header:
  adxl345: |
    # The switch that adds recipes-kernel/linux/files/adxl345.cfg. See the
    # bbappend for why it is opt in.
    BENCH_ADXL345_KERNEL = "1"

    # The part is on I2C. meta-raspberrypi turns this into
    # "dtparam=i2c_arm=on" in config.txt, without which the bus does not
    # exist and the overlay's node has no parent to attach to.
    ENABLE_I2C = "1"

    # And the rest of config.txt, which REPLACES the line inherited from
    # bench-rpi4.yml rather than adding to it.
    #
    # The inherited value loads the 7 inch DSI panel overlay. There is no
    # DSI panel on this board, and an overlay for absent hardware is not
    # free: the node probes, defers, and retries forever, which fills the
    # log and delays everything ordered after it. Projects 6 and 10 both
    # replace it for the same reason and both say so here.
    #
    # The overlay line is deliberately absent until the board has been
    # read. bench,adxl345 needs an address and an interrupt GPIO that are
    # properties of how the breakout is wired, and this bench's DFRobot
    # SEN0032 has not been read yet. A node with a guessed interrupt does
    # not fail safely; it drives whatever else is on that pin.
    RPI_EXTRA_CONFIG = "dtparam=i2c_arm_baudrate=400000"

    # The kernel's work directory has to survive, because ./go kconfig
    # reads the .config it produced and that is how the symbols in
    # adxl345.cfg are shown to have arrived. bench-adxl345 is kept for the
    # same reason one step down: when a module does not load, the first
    # question is whether the .ko was built at all.
    RM_WORK_EXCLUDE += "linux-raspberrypi bench-adxl345"
