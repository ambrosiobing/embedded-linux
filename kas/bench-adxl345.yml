# Project 5: an IIO driver for the ADXL345, written from scratch.
#
#   kas build kas/bench-adxl345.yml        or  ./go adxl345
#
# A separate configuration for the reason in the repository README: a
# project that needs a different kernel adds its own kas file rather than
# changing the shared one. Here the kernel needs the regmap bus glue, the
# two controllers, and mainline's own ADXL345 driver as the control this
# project is measured against.
#
# It includes bench-rpi3.yml rather than bench-rpi4.yml because this is a
# Pi 3 project, and that file already says so in its own first line:
# "Projects 5, 6 and 19 use the identical rootfs on a Raspberry Pi 3".
# raspberrypi3-64 is the whole BCM2837 family in meta-raspberrypi, so it
# covers the 3B and the 3B+ alike.
header:
  version: 14
  includes:
    - bench-rpi3.yml

target: bench-adxl345-image

local_conf_header:
  adxl345: |
    # The switch that adds recipes-kernel/linux/files/adxl345.cfg. See the
    # bbappend for why it is opt in.
    BENCH_ADXL345_KERNEL = "1"

    # The part is on I2C. meta-raspberrypi turns this into
    # "dtparam=i2c_arm=on" in config.txt, without which the bus does not
    # exist and the overlay's node has no parent to attach to.
    ENABLE_I2C = "1"

    # And the rest of config.txt, which removes the one line inherited from
    # bench-rpi4.yml and adds this project's own.
    #
    # The inherited value loads the 7 inch DSI panel overlay. There is no
    # DSI panel on this board, and an overlay for absent hardware is not
    # free: the node probes, defers, and retries forever, which fills the
    # log and delays everything ordered after it. Projects 6 and 10 both
    # replace it for the same reason and both say so here.
    #
    # The overlay line was deliberately absent until the board had been
    # read, because bench,adxl345 needs an address and an interrupt GPIO
    # that are properties of how the breakout is wired, and a node with a
    # guessed interrupt does not fail safely. The board was read on
    # Friday 9 October 2026: 0x53 answered 0xe5, and INT1 was connected
    # to nothing. So the overlay declares the address and no interrupt,
    # and the driver takes its sysfs-only path until INT1 is refitted.
    #
    # Not a plain assignment, and the reason is the card flashed on
    # Friday 9 October 2026. kas writes the
    # local_conf_header sections in sorted order of their names. This
    # section is "adxl345", the shared one in bench-rpi4.yml is "bench",
    # so the shared assignment came later in local.conf and won: the card
    # carried the DSI overlay line and not the baud rate line. Projects 6,
    # 7 and 10 use the same assignment and keep their lines only because
    # "explorer", "lcd35a" and "iio" sort after "bench", and
    # scripts/lint.py check_kas_shared_overrides refuses the assignment.
    # forcevariable, after a remove-and-append pair was tried and did not
    # work: the newline between the lines is the two characters backslash
    # and n in BitBake's value, which rpi-config's echo turns into a line
    # break only when config.txt is written. So the whole value is one
    # whitespace-free token and :remove, which removes whole tokens, found
    # nothing to remove; the card flashed at 76d1e89 on Friday 9 October
    # 2026 still requested the DSI overlay. forcevariable is the override
    # BitBake applies last, whatever the section order.
    #
    # 100 kHz, NOT the 400 kHz the design wanted, and the reason is a
    # measurement. On the first card carrying this overlay, Friday
    # 9 October 2026, the bus at 400 kHz answered nothing: two empty
    # scans and a failed register read where the same part had answered
    # at 100 kHz an hour earlier. With the baud rate line removed by hand
    # and nothing else touched, 0x53 and 0xe5 came back and the driver
    # bound. The breakout sits in a breadboard on six jumpers and two
    # straps; kas/bench-iio.yml already records 400 kHz as the limit over
    # loose jumper wire with NACKs as the symptom. The ADXL345 datasheet
    # bounds the output data rate at 100 kHz to 200 Hz, which is enough
    # for criteria 3 and 4 and not for the FIFO rates in criterion 5;
    # the way back to 400 kHz is shorter wires, not a config change.
    RPI_EXTRA_CONFIG:forcevariable = "dtparam=i2c_arm_baudrate=100000\ndtoverlay=bench-adxl345"

    # The kernel's work directory has to survive, because ./go kconfig
    # reads the .config it produced and that is how the symbols in
    # adxl345.cfg are shown to have arrived. bench-adxl345 is kept for the
    # same reason one step down: when a module does not load, the first
    # question is whether the .ko was built at all.
    RM_WORK_EXCLUDE += "linux-raspberrypi bench-adxl345"
