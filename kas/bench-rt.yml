# Project 8: the real-time latency lab.
#
#   kas build kas/bench-rt.yml        or  ./go rt
#
# A separate configuration, for the reason in the repository README: a
# project that needs a different kernel adds its own kas file rather than
# changing the shared one.
#
# This file is the experiment's variable. Its control is
# kas/bench-rt-generic.yml, which includes this one and sets
# BENCH_RT_KERNEL back to 0: same image, same kernel version, same
# userspace, one symbol different.
#
# It is NOT bench-image from bench-rpi4.yml. That was the original plan and
# it was wrong: bench-rpi4.yml pins no kernel version and gets the BSP
# default 6.6, so comparing against it would put six minor versions of
# scheduler and timer work inside the headline number with nothing in the
# data to separate them from the preemption model.
header:
  version: 14
  includes:
    - bench-rpi4.yml

target: bench-rt-image

# A Raspberry Pi 3 Model B v1.2, 2015, and the reason is mechanical rather
# than technical: that is the board the MCC 118 is physically stacked on
# and seated. The Pi 4 in the drawer was the original plan and the HAT was
# not fitted to it. Why it was not is not recorded here, because it was not
# observed; see journal entries 32 to 34 for what happened when it was
# guessed at instead.
#
# raspberrypi3-64 is the machine for it. meta-raspberrypi uses that name
# for the whole BCM2837 family, so it covers the 3B and the 3B+ alike, and
# the 64 bit build is what ARCH_SUPPORTS_RT needs.
#
# Nothing in this project objects. Both boards are quad-core arm64, so
# ARCH_SUPPORTS_RT and isolcpus=3 mean the same thing on either, and the
# pin numbers in the wiring table are header positions rather than board
# properties. rt-toggle opens /dev/gpiochip0 by path and never looks at the
# SoC label, so the pinctrl-bcm2711 that Projects 1 and 15 match on does
# not appear here; on this board it is pinctrl-bcm2835.
#
# What does change is what the numbers will say. A Cortex-A53 at 1.2 GHz
# with 1 GB of memory, and with Ethernet hanging off the same USB hub as
# everything else, is a harder real-time target than a Cortex-A72 at
# 1.5 GHz, and there is less thermal headroom, so the throttle gate will
# fire sooner under load. The acceptance thresholds written as absolute
# microseconds were written for a Pi 4 and are recorded as such; the
# relative criterion, that the generic kernel is several times worse than
# the real-time one under the same load, is a property of the preemption
# model and holds on either board.
machine: raspberrypi3-64

repos:
  # rt-tests (cyclictest) and stress-ng are in meta-oe, which is already
  # pinned by bench-rpi4.yml. numpy is in meta-python, from the same
  # repository and therefore the same pin: the analysis runs on the board
  # so that a run can be judged before the card is carried back to a desk.
  meta-openembedded:
    layers:
      meta-oe:
      meta-python:

local_conf_header:
  rt: |
    # The switch that adds recipes-kernel/linux/files/rt.cfg. See the
    # bbappend for why it is opt in.
    BENCH_RT_KERNEL = "1"

    # And the kernel that can honour it. PREEMPT_RT depends on
    # EXPERT && ARCH_SUPPORTS_RT, and arch/arm64/Kconfig gained the
    # select in 6.12; conf/machine/include/rpi-default-versions.inc in
    # meta-raspberrypi scarthgap still defaults to 6.6. Without this line
    # the fragment asks for a symbol that has no prompt on 6.6, kconfig
    # drops it silently, and the build succeeds with a kernel that is not
    # preemptible. That failure is invisible until ./go kconfig or
    # /sys/kernel/realtime is read on the board, which is why both are in
    # the acceptance list for this project.
    PREFERRED_VERSION_linux-raspberrypi = "6.12.%"

    # The whole point of this image is to be measured, so the kernel is
    # the one recipe whose work directory has to survive the build: the
    # .config it produced is the evidence that the fragment arrived.
    RM_WORK_EXCLUDE += "linux-raspberrypi bench-rt libdaqhats"


    # The MCC 118 is an SPI device on SPI0 CE0, so the bus has to be in
    # config.txt. meta-raspberrypi turns this into "dtparam=spi=on"; the
    # bench image does not set it, because nothing before this project had
    # anything on the bus. Without it the HAT is powered, its EEPROM is
    # read by the firmware into /proc/device-tree/hat, and every scan
    # fails, which is a confusing place to start debugging.
    ENABLE_SPI_BUS = "1"
