# Project 8: the control.
#
#   kas build kas/bench-rt-generic.yml    or  ./go rt-generic
#
# The same image as kas/bench-rt.yml, on the same kernel version, with the
# same isolation configuration, and with the preemption model left alone.
# These two configurations differ in CONFIG_PREEMPT_RT and in nothing else.
#
# THAT SENTENCE WAS FALSE UNTIL 17 SEPTEMBER 2026 and the correction is
# worth reading before the results are.
#
# There was one kernel fragment behind one switch. This file set that
# switch to "0", so the control received none of the fragment: not
# NO_HZ_FULL, not RCU_NOCB_CPU, not CPU_ISOLATION, not the debug options
# held off, and not CPU_FREQ_DEFAULT_GOV_PERFORMANCE. Eight rows were
# measured against it first. The board is what found it, and only because
# a serial console was attached: adding nohz_full=3 rcu_nocbs=3 to
# cmdline.txt produced "Housekeeping: nohz unsupported" and "Unknown
# kernel command line parameters", on the console and nowhere else.
#
# ./go kconfig could not have caught it. It verifies that a fragment's
# symbols reached the .config, and a build with no fragment has nothing to
# verify, so the check passed by having nothing to say. Journal 57,
# decisions 88 and 89.
#
# The old version of this file argued, in a comment, that the isolation
# symbols were "part of the configuration under test rather than
# incidental, which is why they travel together in one fragment". That is a
# coherent experiment and it is a different one: it compares a stock kernel
# against an adopted real-time configuration. It is not the experiment this
# file's own header claimed, and the header is what the README and the
# journal repeated.
#
# Both are now available, and the second costs no extra build. The eight
# stock rows measured on 17 September are kept in
# results/2026-09-17_5ec99fd-dirty, so:
#
#     stock           -> this control      what the isolation config buys
#     this control    -> bench-rt          what PREEMPT_RT alone buys
#     stock           -> bench-rt          what adopting the lot buys
#
# Without it the comparison is 6.6 generic against 6.12 real-time, because
# PREEMPT_RT depends on ARCH_SUPPORTS_RT which arm64 gained in 6.12, and
# meta-raspberrypi still defaults to 6.6. Six minor versions of scheduler,
# timer and driver work would sit inside the headline number with nothing
# in the data to separate them from the preemption model. The numbers would
# be real and the claim would be uninterpretable.
#
# The image target is deliberately the same, so both kernels run an
# identical userspace: the same instruments, the same libraries, the same
# Python. Everything above the kernel is held constant by construction
# rather than by care.
header:
  version: 14
  includes:
    - bench-rt.yml

# BENCH_RT_LAB stays at the "1" that bench-rt.yml sets, so rt-common.cfg is
# applied here too: the 6.12 kernel, SPI for the HAT, meta-python for numpy,
# the work directories kept for inspection, and now also NO_HZ_FULL,
# RCU_NOCB_CPU, CPU_ISOLATION, the debug options held off and the
# performance governor by default.
#
# Only BENCH_RT_KERNEL is turned back off, and it now gates a fragment
# containing one symbol.
local_conf_header:
  rt_generic: |
    # Spelled out rather than left to the default, because a reader of a
    # results table should be able to find the line that made the control
    # a control.
    #
    # This is the only line that differs from kas/bench-rt.yml. If a second
    # one ever appears here, the comparison has stopped being one.
    BENCH_RT_KERNEL = "0"
