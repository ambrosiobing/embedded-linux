# The single place where versions live.
#
#   kas build kas/bench-rpi4.yml
#
# Moving to the next LTS means changing the branch names below and nothing
# else. Before tagging a release, replace each branch with the commit hash
# that was actually built (kas dump --lock writes those for you).
header:
  version: 14

machine: raspberrypi4-64
distro: poky
target: bench-image

repos:
  # No url: this is the repository that contains this file. Its root is
  # not a layer, it is a monorepo holding twenty projects, so the layer
  # inside it is named explicitly. A later project that needs a second
  # layer of its own adds it to this same list.
  bench:
    layers:
      meta-bench:

  poky:
    url: https://git.yoctoproject.org/poky
    branch: scarthgap
    layers:
      meta:
      meta-poky:

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    branch: scarthgap
    layers:
      meta-oe:

  meta-raspberrypi:
    url: https://git.yoctoproject.org/meta-raspberrypi
    branch: scarthgap

local_conf_header:
  bench: |
    INIT_MANAGER = "systemd"
    ENABLE_UART = "1"

    # Two consoles, not one. A bench board whose only console is a serial
    # cable is undebuggable the day that cable fails, and this bench has
    # no working USB/TTL adapter at all.
    #
    # This used to say CMDLINE_CONSOLE, which does nothing. That variable
    # is not in meta-raspberrypi scarthgap: rpi-cmdline.bb builds CMDLINE
    # from CMDLINE_ISOL_CPUS, DWC_OTG, SERIAL, ROOTFS, CMA, KGDB, LOGO,
    # PITFT, DEBUG, RNDIS and IFNAMES, and nothing else. The serial console
    # comes from CMDLINE_SERIAL, which ENABLE_UART above already sets.
    #
    # So every image this bench has built has had a serial console only.
    # The DSI panel has shown a login prompt, because systemd starts
    # getty@tty1 whatever the kernel is told, and has never shown a kernel
    # message. Appending is the only hook that recipe leaves open, and
    # tty1 goes last so that it becomes /dev/console.
    CMDLINE:append = " console=tty1"

    # The bench console is the official 7 inch DSI panel. Under the KMS
    # driver that panel needs its overlay named explicitly; without it
    # the backlight comes on and nothing is ever drawn, which is
    # indistinguishable from a board that did not boot. Remove this line
    # if the panel is not attached.
    RPI_EXTRA_CONFIG = "dtoverlay=vc4-kms-dsi-7inch"

    # The Pi 4 radio firmware is proprietary. Yocto refuses to build a
    # recipe carrying LICENSE_FLAGS until that flag is named here, so
    # that shipping a non-open binary is a decision somebody made rather
    # than an accident. Accepting it is the decision, recorded here.
    LICENSE_FLAGS_ACCEPTED = "synaptics-killswitch"
    IMAGE_FSTYPES = "wic.bz2 wic.bmap"
    INHERIT += "rm_work buildhistory"
    BUILDHISTORY_COMMIT = "1"

    # rm_work reclaims the disk but deletes the sources you want to
    # read when something is wrong. Keep the two that get debugged.
    RM_WORK_EXCLUDE += "linux-raspberrypi bench-status"

  # Keep the caches outside the build tree so that deleting build/ costs
  # minutes rather than hours. scripts/build.sh exports both variables.
  cache: |
    DL_DIR ?= "${TOPDIR}/../downloads"
    SSTATE_DIR ?= "${TOPDIR}/../sstate-cache"

  parallel: |
    BB_NUMBER_THREADS ?= "8"
    PARALLEL_MAKE ?= "-j 8"
