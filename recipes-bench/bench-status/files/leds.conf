# Which lines the status LEDs sit on, and which way round they are.
#
# The LED modules on the bench have four pins: S1 is the signal, S2 is
# unused, U is the 3V3 supply and G is ground. The series resistor is on the
# module, so there is none on the breadboard.
#
# A module wired anode-to-S1 lights when the line is driven high. A module
# wired supply-to-anode with the cathode on S1 lights when the line is
# pulled low. Both are common and the silkscreen rarely says which, so
# settle it once with the board running:
#
#   gpioset -c gpiochip0 17=1     green lights? active high, leave this 0
#   gpioset -c gpiochip0 17=0     green lights? active low, set this to 1
#
# gpioset in libgpiod v2 holds the line until you interrupt it, so press
# Ctrl-C between the two commands.
#
# Nothing else in the layer changes: libgpiod keeps the wiring separate from
# the meaning, so the daemon asks for active and the kernel decides which
# voltage that is.

# BCM line offsets for the three modules.
green=17
yellow=27
red=22

# 1 if an LED lights when its line is pulled low.
active_low=0

# GPIO chip carrying the 40-pin header, matched by label so that the
# numbering may move between kernels. chip=/dev/gpiochipN overrides it.
chip_label=pinctrl-bcm2711
