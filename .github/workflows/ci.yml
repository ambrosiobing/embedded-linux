# What a hosted runner can honestly check about a Yocto layer.
#
# It cannot build the image: that needs 60 GB and three hours, and the
# stretch goal moves that to a self-hosted runner with a shared sstate
# mirror. What it can do is compile the application for real, run the static
# layer checks and exercise the state machine. Those are the things that
# actually break while a layer is being edited.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    # Pinned, not "latest". The daemon needs libgpiod v2 headers, and
    # ubuntu-latest moved without telling anyone: it carried v1, so every
    # run failed with forty lines of implicit-declaration errors.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install checkers
        run: |
          sudo apt-get update
          # pkg-config is used by the compile steps below. The runner
          # image usually has it, and "usually" is not a dependency.
          sudo apt-get install -y shellcheck python3-yaml libgpiod-dev pkg-config build-essential

      - name: Static layer checks
        run: python3 scripts/lint.py

      - name: Shell scripts
        # Found rather than listed, so a new script cannot quietly escape the
        # check. SC1090 and SC1091 are the sourced common.sh, whose path is
        # built at run time and cannot be followed statically.
        run: |
          files=$( {
            grep -rl --exclude-dir=.git --exclude=*.md "^#!/bin/sh" .
            find . -path ./.git -prune -o -name "*.sh" -print
          } | sed "s|^[.]/||" | sort -u)
          echo "checking:"; echo "$files"
          shellcheck -s sh -e SC1090,SC1091 $files

      - name: Compile the daemon
        # Not the cross build, but the same source and stricter warnings than
        # the recipe uses: a toolchain upgrade should fail here, where it can
        # be fixed, rather than in someone's image build.
        run: |
          version=$(pkg-config --modversion libgpiod)
          echo "libgpiod $version"
          case "$version" in
          2.*) ;;
          *)
            echo "This runner has libgpiod v$version; the daemon targets v2."
            echo "Pin runs-on to an image whose libgpiod-dev is 2.x."
            exit 1
            ;;
          esac
          gcc -Wall -Wextra -Werror -O2 $(pkg-config --cflags libgpiod) meta-bench/recipes-bench/bench-status/files/bench-status.c -o /tmp/bench-status $(pkg-config --libs libgpiod)

      - name: Daemon starts and reports no GPIO chip on a runner
        # There is no gpiochip on a hosted runner, so a clean exit code 1 is
        # the correct outcome and proves the binary links and runs.
        run: |
          if timeout 5 /tmp/bench-status; then
            echo "unexpected: the runner has a usable GPIO chip"
            exit 1
          fi

      - name: Compile the SDK example
        run: make -C sdk/hello-gpiod

      - name: Tests
        # Every test in tests/, so adding one is enough to have CI run it.
        run: |
          for t in tests/*.sh; do
            echo "== $t"
            sh "$t" || exit 1
          done

  image:
    # Opt in: the build needs a self-hosted runner with the sstate mirror.
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, yocto]
    steps:
      - uses: actions/checkout@v4
      - name: Build bench-image
        run: ./go build
      - name: Kernel fragment reached the .config
        run: ./go kconfig
      - name: Package list
        run: ./go packages
