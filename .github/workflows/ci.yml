# What a hosted runner can honestly check about a Yocto layer.
#
# It cannot build the image: that needs 60 GB and three hours, and the
# stretch goal moves that to a self-hosted runner with a shared sstate
# mirror. What it can do is compile the application for real, run the static
# layer checks and exercise the state machine. Those are the things that
# actually break while a layer is being edited.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege. This workflow reads the repository and writes nothing, so
# say so rather than inheriting whatever the repository default happens to
# be. A compromised action in a job with a write token can push.
permissions:
  contents: read

# A newer push makes an older run pointless. Cancel it rather than pay for
# both and read two results.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Pinned, not "latest". The daemon needs libgpiod v2 headers, and
    # ubuntu-latest moved without telling anyone: it carried v1, so every
    # run failed with forty lines of implicit-declaration errors.
    runs-on: ubuntu-24.04
    steps:
      # Pinned to a commit, not a tag. A tag is mutable: whoever controls
      # the action can move v4 to different code, which is the standard
      # supply-chain attack on CI. Same rule as pinning Yocto layers.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Install checkers
        run: |
          sudo apt-get update
          # pkg-config is used by the compile steps below. The runner
          # image usually has it, and "usually" is not a dependency.
          # No libgpiod-dev here on purpose: Ubuntu LTS packages v1, and
          # the daemon targets v2. It is built from a pinned tag below.
          # nftables is here for the ruleset check in tests/: the
          # semantic assertions run anywhere, the syntax check needs nft.
          # python3-numpy: tests/rt-analyze-test.sh checks Project 8's
          # edge-timing arithmetic against a synthesised waveform, which
          # is the only part of that lab a runner can prove anything
          # about. Skipping it would mean the test silently never ran.
          # libsystemd-dev and libcbor-dev: Project 12's daemon is
          # sd-bus plus libcbor, and the sd-bus vtable is a table of
          # macros whose mistakes are compile errors. Nothing short
          # of a board can check an interface declaration; this can.
          # libdrm-dev: Project 7's drmfill, compiled here with -Werror.
          # The host libdrm is the same API the target has, so a mistake
          # in the DRM calls is caught here rather than by a board.
          # device-tree-compiler: Project 7's overlay is compiled with
          # dtc -@ by tests/lcd35a-overlay-test.sh, and its acceptance
          # criterion is that it compiles WITHOUT WARNINGS. That test
          # skips where dtc is absent, so without this package the
          # assertion would be written and never run, which is worse
          # than not having it.
          # cmake: Project 11 is a CMake library, and
          # tests/adxl345-build-test.sh configures, builds and runs it
          # against its fake bus. Without cmake that suite skips its
          # compile section and says so, which would make its own skip
          # message ("CI installs cmake and does compile it") false.
          sudo apt-get install -y shellcheck python3-yaml python3-numpy pkg-config build-essential autoconf autoconf-archive automake libtool nftables libsystemd-dev libcbor-dev libdrm-dev device-tree-compiler cmake

      - name: Build libgpiod v2 from a pinned tag
        # Ubuntu 24.04 packages libgpiod 1.6.3 and the daemon targets v2, so
        # the library is built here rather than taken from the runner image.
        # Pinned to the 2.1 line, which is what the target image carries, and
        # taken from kernel.org because the GitHub mirror lacks those tags.
        #
        # Same discipline the kas file applies to every Yocto layer: name the
        # version rather than inherit whatever happens to be lying around. It
        # also makes this check independent of GitHub changing its images,
        # which is how thirteen runs came to fail.
        run: |
          git clone --depth 1 --branch v2.1.3 https://git.kernel.org/pub/scm/libs/libgpiod/libgpiod.git /tmp/libgpiod
          cd /tmp/libgpiod
          ./autogen.sh --enable-tools=no --prefix=/usr/local
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig

      - name: Static layer checks
        run: python3 scripts/lint.py

      - name: Shell scripts
        # Found rather than listed, so a new script cannot quietly escape the
        # check. SC1090 and SC1091 are the sourced common.sh, whose path is
        # built at run time and cannot be followed statically.
        run: |
          files=$( {
            grep -rl --exclude-dir=.git --exclude=*.md "^#!/bin/sh" .
            find . -path ./.git -prune -o -name "*.sh" -print
          } | sed "s|^[.]/||" | sort -u)
          echo "checking:"; echo "$files"
          shellcheck -s sh -e SC1090,SC1091 $files

      - name: Compile the daemon
        # Not the cross build, but the same source and stricter warnings than
        # the recipe uses: a toolchain upgrade should fail here, where it can
        # be fixed, rather than in someone's image build.
        run: |
          version=$(pkg-config --modversion libgpiod)
          echo "libgpiod $version"
          case "$version" in
          2.*) ;;
          *)
            echo "This runner has libgpiod v$version; the daemon targets v2."
            echo "Pin runs-on to an image whose libgpiod-dev is 2.x."
            exit 1
            ;;
          esac
          gcc -Wall -Wextra -Werror -O2 $(pkg-config --cflags libgpiod) meta-bench/recipes-bench/bench-status/files/bench-status.c -o /tmp/bench-status $(pkg-config --libs libgpiod)

      - name: Compile the modem control tool
        # Project 15's mechanism half. Same source, same -Werror: a
        # toolchain upgrade should fail here rather than in someone's
        # three-hour image build.
        run: |
          gcc -Wall -Wextra -Werror -O2 $(pkg-config --cflags libgpiod) meta-bench/recipes-bench/bench-lte/files/lte-gpio.c -o /tmp/lte-gpio $(pkg-config --libs libgpiod)

      - name: Compile the tracker control tool
        # Project 16's power key and instrument marker. A separate binary
        # from Project 15's above on purpose: that one ships in bench-lte,
        # whose package drags ModemManager and NetworkManager into any
        # image installing it, and a tracker installs neither.
        run: |
          gcc -Wall -Wextra -Werror -O2 $(pkg-config --cflags libgpiod) meta-bench/recipes-bench/bench-tracker/files/tracker-gpio.c -o /tmp/tracker-gpio $(pkg-config --libs libgpiod)

      - name: tracker-gpio reports its state and refuses an unset pin
        # Both directions, because a guard that has never refused is
        # indistinguishable from a guard that is not there. "info" touches
        # no line and must succeed; "pwrkey" must refuse with exit 2,
        # because a runner has no /etc/bench/tracker.conf and therefore no
        # offset. There is no default offset on purpose: a GPIO offset is a
        # property of a HAT on a board revision, and a wrong one drives
        # whatever else is on the pin.
        run: |
          /tmp/tracker-gpio info
          # The status is captured rather than tested in an if condition.
          # This step runs under bash -e, so the expected non-zero would
          # end the step before it could be checked, and reading $? out of
          # an elif after a failed condition is a trick that works and that
          # nobody should have to verify while reading a CI log.
          set +e
          /tmp/tracker-gpio pwrkey
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "tracker-gpio drove a pin with no offset configured."
            exit 1
          fi
          if [ "$status" -ne 2 ]; then
            echo "tracker-gpio refused with exit $status, not the"
            echo "documented exit 2, so something other than the missing"
            echo "offset stopped it."
            exit 1
          fi
          echo "refused an unset pwrkey_gpio with exit 2, as it must"

      - name: Compile the real-time toggler
        # Project 8's instrument. A number that reaches a results table
        # should come from a program that compiles without a warning about
        # a conversion or an uninitialised variable.
        run: |
          gcc -Wall -Wextra -Werror -O2 $(pkg-config --cflags libgpiod) meta-bench/recipes-bench/bench-rt/files/rt-toggle.c -o /tmp/rt-toggle $(pkg-config --libs libgpiod)

      - name: Compile the sensor hub daemon
        # Two libraries at once, and the only check anywhere that looks at
        # the D-Bus interface declaration. proto.c is compiled in here too,
        # which is the same file the firmware compiles.
        run: |
          src=meta-bench/recipes-bench/bench-sensorhub/files
          gcc -Wall -Wextra -Werror -O2 -I"$src" $(pkg-config --cflags libsystemd libcbor) "$src/sensorhubd.c" "$src/proto.c" -o /tmp/sensorhubd $(pkg-config --libs libsystemd libcbor)

      - name: Python programs compile
        # Found by shebang, so a new one cannot quietly escape the check.
        run: |
          files=$( {
            grep -rl --exclude-dir=.git --exclude=*.md "^#!/usr/bin/env python3" .
            find . -path ./.git -prune -o -name "*.py" -print
          } | sed "s|^[.]/||" | sort -u)
          echo "checking:"; echo "$files"
          for f in $files; do python3 -m py_compile "$f"; done

      - name: Daemon starts and reports no GPIO chip on a runner
        # There is no gpiochip on a hosted runner, so a clean exit code 1 is
        # the correct outcome and proves the binary links and runs.
        run: |
          if timeout 5 /tmp/bench-status; then
            echo "unexpected: the runner has a usable GPIO chip"
            exit 1
          fi

      - name: Compile drmfill
        # Project 7's DRM test program. It exists as a step here AND in
        # scripts/host-check.sh because this workflow does not run that
        # script: it keeps its own list, by hand, and the two drift.
        #
        # That drift is exactly how this step came to be missing. The
        # libdrm-dev line was added to the install step above and to
        # host-setup.sh, and both looked like the work was done, while
        # nothing in CI ever compiled the program. A dependency installed
        # for a step that does not exist is worse than an absent
        # dependency, because it reads as done in every later diff.
        run: |
          gcc -Wall -Wextra -Werror -O2 $(pkg-config --cflags libdrm) meta-bench/recipes-bench/bench-lcd35a/files/drmfill.c -o /tmp/drmfill $(pkg-config --libs libdrm)

      - name: drmfill finds no panel on a runner
        # The card-walking path, which replaced a hard-coded
        # /dev/dri/card1. A runner has no ili9486, so exit 1 is the
        # correct answer and anything else means the search is wrong.
        run: |
          if /tmp/drmfill -t 1; then
            echo "unexpected: this runner has a card driven by ili9486"
            exit 1
          fi
          echo "reports no panel, as expected off-target"

      - name: Compile the SDK example
        run: make -C sdk/hello-gpiod

      - name: Tests
        # Every test in tests/, so adding one is enough to have CI run it.
        run: |
          for t in tests/*.sh; do
            echo "== $t"
            sh "$t" || exit 1
          done

  image:
    # Opt in: the build needs a self-hosted runner with the sstate mirror.
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, yocto]
    steps:
      # Pinned to a commit, not a tag. A tag is mutable: whoever controls
      # the action can move v4 to different code, which is the standard
      # supply-chain attack on CI. Same rule as pinning Yocto layers.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Build bench-image
        run: ./go build
      - name: Kernel fragment reached the .config
        run: ./go kconfig
      - name: Package list
        run: ./go packages
