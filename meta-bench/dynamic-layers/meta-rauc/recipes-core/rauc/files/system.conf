# Project 19: the RAUC system configuration.
#
# This file is the target's own description of itself. RAUC reads it to
# learn which partitions are slots, which slot it is running from, and what
# a bundle has to claim before it is allowed to be written anywhere.

[system]
# THE STRING THAT STOPS A BUNDLE REACHING THE WRONG BOARD. It is compiled
# into every bundle at build time and compared before anything is written.
# A Pi 4 bundle on this card is refused here rather than discovered at the
# next boot, which matters because the symptom of a wrong image on a
# Raspberry Pi is a dark board and no console output at all.
#
# It is not a version. Changing it makes every existing bundle
# uninstallable on every existing device, so it names the hardware and the
# layout rather than the release.
compatible=bench-rpi3

# U-Boot owns the boot decision, so RAUC writes BOOT_ORDER and BOOT_x_LEFT
# through fw_setenv into the same uboot.env the boot script reads.
# rauc-target.inc adds u-boot-fw-utils automatically because
# PREFERRED_PROVIDER_virtual/bootloader contains u-boot, which is set in
# kas/bench-rpi3-ab.yml.
bootloader=uboot

# Bundles are verity format: the payload is a dm-verity image whose root
# hash is what gets signed, so a bundle can be verified before it is fully
# read rather than only after. The older plain format hashes the whole
# file, which means a truncated download looks identical to a hostile one
# until the last byte arrives.
bundle-formats=verity

# RAUC's own state, on the shared persistent partition. It has to survive
# an update, because the thing it records is which slot was updated, and it
# has to be outside both slots, because a slot cannot be trusted to
# remember whether it is trustworthy.
#
# This is a shared resource with no second owner by design. Figure 2 lists
# it alongside /etc and /var as state that a rollback does not undo.
data-directory=/data/rauc

[keyring]
# The public half only. The signing key never leaves the build laptop and
# is never in this repository; bench-ab-image.bb and the rauc-conf
# bbappend both refuse to build without being told where the certificate
# is, rather than quietly falling back to meta-rauc's example one, which
# would produce a device that trusts a certificate published on the
# internet.
path=/etc/rauc/ca.cert.pem

[handlers]
# The red LED, driven from RAUC's own lifecycle rather than from a guess
# about how long an install takes.
#
# pre-install runs after the bundle has been verified and mounted and
# before anything is written, so steady red means exactly what figure 3
# says it means: a write is in progress and the card must not lose power.
#
# post-install runs only after a SUCCESSFUL install. That asymmetry is the
# error handling: if the install fails, the second handler never runs, the
# red LED stays on, and the board is visibly saying that the inactive slot
# was left half written. Nothing here needs to detect the failure.
#
# Paths, not commands. RAUC passes no arguments to a handler, which is why
# these are two one-line wrappers rather than one script with a parameter.
pre-install=/usr/bin/bench-rauc-pre-install
post-install=/usr/bin/bench-rauc-post-install

# The two slots of figure 2. Both are ext4 and both are exactly 1024 MiB,
# fixed in bench-ab.wks so that a bundle built for one always fits the
# other.
#
# bootname is the link between this file and the boot script: it is the
# string RAUC writes into BOOT_ORDER and the letter the script compares
# against. Change one and the other stops meaning anything, with no error
# from either side.
[slot.rootfs.0]
device=/dev/mmcblk0p2
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/mmcblk0p3
type=ext4
bootname=B
