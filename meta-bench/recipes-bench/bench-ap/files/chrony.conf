# chrony on the access point, Project 18.
#
# WHY AN ISOLATED ISLAND WITH NO UPLINK RUNS A TIME SERVER.
#
# Decision 111 records that this board cannot know the time: no
# battery-backed clock, no uplink, so systemd moves it forward to about the
# image build time and stops. That is good enough for the board's own
# certificate checks, because the certificate authority is created before
# the image is built.
#
# The clients are worse off, and that was missed when the design was
# written. An ESP32 or ESP8266 has no clock at all and powers up in 1970.
# It then checks the broker's certificate, finds a notBefore in 2026, and
# refuses to connect with "certificate is not yet valid". Nothing about the
# error mentions a clock. The same applies, less severely, to any Linux
# client whose own image is older than this bench's certificate authority.
#
# So the access point serves the one thing it does know: its own
# approximate time, which decision 111 guarantees is no earlier than the
# CA. Every client on the island then agrees on a time at which every
# certificate on the island is valid.
#
# THIS IS NOT ACCURATE TIME AND IS NOT CLAIMED TO BE.
#
# It is the image build date plus however long the board has been up. It is
# wrong by days or weeks and it is monotonic, which is all certificate
# validity needs. Nothing here should be used to timestamp a measurement:
# Project 3 and Project 8 both take their timing from the board's own
# monotonic clock for exactly this reason.

# No upstream servers. There is no uplink, and listing one would mean
# chronyd spending every poll interval failing to reach it.

# Serve the local clock even though it is synchronised to nothing.
#
# Without this line chronyd refuses to answer at all, because by default a
# server will not hand out a time it cannot vouch for. That refusal is
# correct on the internet and wrong here, where the alternative is clients
# that think it is 1970.
#
# Stratum 10 is deliberately poor. Any client that can reach a real time
# source should prefer it, and a client that cannot has nothing better.
local stratum 10 orphan

allow 10.18.0.0/24

# The clock is stored across reboots, so a board that has been up for a
# week does not go backwards when it is power cycled. systemd does
# something similar for itself; this covers chronyd's own idea of the time.
driftfile /var/lib/chrony/drift
rtcsync

# Step rather than slew when the offset is large, which on a board with no
# clock it always is at boot. Slewing a fifty year error would take longer
# than the project.
makestep 1.0 -1

logdir /var/log/chrony
