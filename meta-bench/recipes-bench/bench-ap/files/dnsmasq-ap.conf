# dnsmasq, Project 18. DHCP only. No DNS.
#
# dnsmasq is perfectly able to do both, and doing both here would mean
# either forwarding to an upstream that does not exist on this island, or
# answering for a domain this project does not own. Clients dial the broker
# by address, which is also what the server certificate can carry in its
# subjectAltName.

# port=0 switches the DNS listener off entirely. Leaving it on and simply
# not configuring it gives a resolver that answers SERVFAIL, which looks to
# a client like a broken network rather than an absent service.
port=0

interface=wlan0
# bind-interfaces rather than the default wildcard bind. With the default,
# dnsmasq binds every interface and filters by name, so it would answer on
# an interface this project does not own the moment one appears.
bind-interfaces
except-interface=lo

dhcp-range=10.18.0.50,10.18.0.150,12h
dhcp-authoritative

# Option 3 with no value means "send no router", and option 6 means "send
# no DNS server". Both are deliberate and both are the honest answer on an
# island: there is no gateway and no resolver. A client told about a
# default route it cannot use spends its timeouts discovering that, and on
# a phone it usually decides the network is broken and disconnects.
dhcp-option=3
dhcp-option=6

# Option 42 is the NTP server list, and unlike the two above it is sent.
#
# This is the one service an island genuinely has to provide, and the
# reason is certificates rather than convenience. A client with no
# real-time clock powers up in 1970, checks the broker's certificate, finds
# a notBefore in 2026 and refuses to connect with an error that says
# nothing about a clock. An ESP32 and an ESP8266 are both in that position
# and both are this project's station clients.
#
# The access point serves the only time it knows, which is about its own
# image build date, and decision 111 guarantees that is no earlier than the
# certificate authority. See chrony.conf for why that is enough and why it
# is not accurate time.
dhcp-option=42,10.18.0.1

# The leases survive a restart of dnsmasq but not of the board, which is
# correct here: /run is a tmpfs and a lease database that outlived the
# address plan would be worse than none.
dhcp-leasefile=/run/bench/dnsmasq.leases

log-dhcp
