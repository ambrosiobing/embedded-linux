# A drop-in for chronyd.service, Project 18.
#
# Same shape and the same reason as the broker's: the only thing this
# project changes is which configuration file is read, so a drop-in says
# exactly that and survives an update of the chrony recipe.

[Unit]
# The address has to exist before chronyd binds to it, for the same reason
# the broker does.
After=bench-hostapd.service systemd-networkd.service
Wants=bench-hostapd.service

[Service]
# Cleared before it is set. A drop-in appends to a list, and chronyd.service
# already has an ExecStart; two of them is two daemons on one port.
ExecStart=
ExecStart=/usr/sbin/chronyd -n -f /etc/bench/chrony.conf
