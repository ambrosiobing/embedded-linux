# The SIM7600E-H HAT on this bench, as seen by lte-gpio(1) and
# lte-watchdog(8). One file for both, because the GPIO offsets are a
# property of the HAT revision and not of the language a program is
# written in.
#
# The two offsets below are the Waveshare demo's default jumper positions.
# They are a starting point, not a promise: confirm them against the HAT
# schematic before enabling the watchdog, because a wrong PWRKEY offset
# means the level 3 recovery toggles something else on the header.

chip_label = pinctrl-bcm2711
pwrkey = 6
flight = 4
pwrkey_press_ms = 1200
pwrkey_off_ms = 3000
pwrkey_on_ms = 1200
pwrkey_gap_s = 10

# The last-resort recovery is armed by hand, once, and only after somebody
# has put the HAT schematic next to the output of "lte-gpio info".
#
# The two offsets above come from a vendor demo and the default jumper
# positions, and both are properties of a HAT revision rather than of the
# part. A wrong offset does not fail safely: it drives whatever else is on
# that header pin, on a board that is by then unattended and unreachable.
#
# While this is 0 the watchdog still performs levels 1 and 2, which handle
# almost everything, refuses level 3 with a line in the journal, and counts
# the refusal in lte_pwrkey_refused_total so that the un-armed state is
# visible on a dashboard rather than silent.
pwrkey_verified = 0

# Probing. The host is pinged through the bearer itself, so it has to be
# something that answers ICMP and is not behind the failure being tested.
probe_host = 1.1.1.1
probe_iface = wwan0
probe_interval = 60
probe_timeout = 3
failures_before_recovery = 3

# The NetworkManager profile name that level 1 brings back up.
nm_connection = lte

# How long to leave the modem alone after a recovery before probing again.
settle_s = 60
settle_cold_s = 120

metrics_path = /var/lib/lte/watchdog.prom
metrics_dir = /var/lib/lte

# Signal statistics refresh period, seconds, passed to mmcli --signal-setup.
signal_refresh_s = 10

# The GNSS engine costs power and a little modem CPU, so the position is
# off until somebody asks for it. See docs/BRINGUP.md.
export_location = 0

# The uplinks the exporter reports a default route for.
# wan0 is the USB wireless adapter, named by udev. See
# recipes-bench/bench-router/files/76-bench-uplink.rules.
uplinks = eth0 wan0 wwan0
