# Where the metrics endpoint listens.
#
# The bind address is the access point address, not 0.0.0.0. A metrics
# endpoint on a box with a public carrier address is an unauthenticated
# read of that box's location and signal history, and binding to the LAN
# is the cheap half of preventing that. The nftables input chain is the
# other half; either alone would be enough, which is the point.
METRICS_BIND=10.20.0.1
METRICS_PORT=9101
METRICS_DIR=/var/lib/lte
