# Project 16, the Cat-M and NB-IoT tracker.
#
# THIS FILE CARRIES NO CREDENTIALS IN THE REPOSITORY, and it is installed
# empty where they belong. The image carries capability and the card
# carries identity: an APN, a server address and a SIM PIN are properties
# of the network a particular card is joining, so they are written on the
# FAT boot partition after flashing, with any text editor, and never
# committed. Every project on this bench works this way.
#
# The file is read by two programs and they agree on its format: tracker
# for everything, and tracker-gpio for the four gpio keys. Both tolerate a
# byte order mark on the first key, CRLF endings, and a final line with no
# newline, because it is edited on Windows.

# ---------------------------------------------------------------- network
# The APN your operator gave you. Empty means the modem is left with
# whatever context it already has, which is usually not what you want.
apn=

# Where reports go. A CoAP server, plain UDP, no DTLS yet.
coap_host=
coap_port=5683
coap_path=bench/16/position

# ------------------------------------------------------------------- port
# Created by the udev rule in 78-sim7070.rules, which on Monday 21
# September 2026 does not yet create it: the modem's product id and AT
# interface number have not been read off the board. Until they have, run
# tracker with -p /dev/tracker-tty-NN against whichever interface answers
# AT. The rule file says how to find out.
port=/dev/tracker-at
baud=115200

# ------------------------------------------------------------------- GPIO
# NO DEFAULTS, ON PURPOSE. A GPIO offset is a property of this HAT on this
# board revision, and a wrong one drives whatever else is on the pin. With
# these unset tracker-gpio refuses and says which key it wanted, which is
# the state to leave them in until the header has been read against the
# schematic. Offsets are gpiochip offsets, not header pin numbers and not
# wiringPi numbers.
#
# The HAT's logic voltage is selectable between 5 V and 3.3 V by a 0-ohm
# resistor. Confirm it is on 3.3 V before connecting anything to a Pi GPIO:
# 5 V into a Pi input destroys the pin, and it destroys it silently.
pwrkey_gpio=
pwrkey_press_ms=1200
pwrkey_active_low=0

# The line the PPK2 watches as a logic channel. The tracker holds it high
# for exactly the duration of one report, and the charge integrated between
# those two edges is acceptance criterion 6. Unset means no markers, which
# means no charge budget: the tracker says so once and carries on, because
# a bench without the instrument attached should still be able to report.
marker_gpio=
marker_active_low=0

# pinctrl-bcm2835 is the Raspberry Pi 3. A Pi 4 is pinctrl-bcm2711, which
# is what Project 15's tool defaults to; this project runs on the Pi 3
# because the SIM7070G HAT needs a full 40-pin header and the NanoPi NEO
# Air has 24 pins and no place to put it.
gpio_chip=pinctrl-bcm2835

# -------------------------------------------------------------------- PSM
# REQUESTED, not granted. The network answers with what it will actually
# give, which may be shorter, longer, or nothing at all, and the tracker
# reads the answer back and logs it. Do not read these two lines as a
# statement about how the device behaves.
#
# Both are 3GPP timer octets: three bits of unit then five of count, and
# the two timers use different unit tables. 00101000 is unit 001, hours,
# count 01000, so eight hours. Changing one bit of the unit turns that into
# two seconds, which is why the tracker decodes them and prints seconds.
psm_tau=00101000
psm_active=00000001

# eDRX, empty to leave it alone. Requesting both PSM and eDRX is the usual
# arrangement: eDRX governs how reachable the device is while it is awake,
# PSM how long it is not awake at all. Acceptance criterion 8 is the
# measurement of that trade.
edrx_cycle=

# ------------------------------------------------------------- behaviour
report_interval_s=3600
backoff_base_s=60
at_timeout_s=10
attach_timeout_s=180
attach_poll_s=2

# CoAP's confirmable retransmission, RFC 7252's defaults. Four
# retransmissions from a two second base is about thirty seconds of trying
# before a report is given up on.
ack_timeout_s=2
max_retransmit=4
