# Units whose health the status LEDs report. One unit per line; blank lines
# and # comments are ignored. Anything listed here that is not active turns
# the red LED on, which is what makes "systemctl stop sshd.socket" visible
# from across the room.
#
# openssh in poky is socket-activated, so the socket is the unit that is
# supposed to stay up; sshd.service only runs while someone is logged in.
sshd.socket
