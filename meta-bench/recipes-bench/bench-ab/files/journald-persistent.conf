# Project 19: the journal has to survive the reboot it is explaining.
#
# WITHOUT THIS THE PROJECT CANNOT SHOW ITS OWN EVIDENCE. A read-only root
# gives a volatile journal, held in tmpfs and erased at every reboot. Every
# interesting event in an A/B system is followed immediately by a reboot:
# a health check fails and the board reboots, a watchdog fires and the
# board reboots, the failsafe timer gives up and the board reboots. In each
# case the log explaining why is destroyed by the event it describes, and
# what a reader gets is a board that is now running the other slot for no
# recorded reason.
#
# Storage=persistent puts it in /var/log/journal, which this project
# symlinks onto the shared data partition, so the record outlives both the
# reboot and the rollback.
#
# The cap is small on purpose. The data partition is 512 MiB and is shared
# with RAUC's status, the /etc overlay and downloaded bundles, and a
# journal that fills it would break the update mechanism to preserve the
# logs about the update mechanism.
[Journal]
Storage=persistent
SystemMaxUse=64M
SystemMaxFileSize=8M
