# The journal's real home on the shared data partition.
#
# /var/log/journal is a symlink to this path, created at image build time,
# because a read-only root cannot make one at boot. systemd-journald
# follows the symlink but will not create the directory behind it, so it
# has to exist before journald starts. tmpfiles.d runs early enough, and
# /data is mounted before init by the overlayfs-etc preinit.
#
# Type d rather than D: D would empty it on every boot, which is precisely
# the behaviour this whole arrangement exists to avoid.
d /data/journal 0755 root root -
