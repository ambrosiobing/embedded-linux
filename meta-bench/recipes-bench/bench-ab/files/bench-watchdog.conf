# Project 19: systemd feeds the SoC watchdog.
#
# THE NUMBER IS 14 BECAUSE THE HARDWARE CANNOT DO MORE. The Raspberry Pi
# watchdog counts in PM_WDOG ticks and saturates a little short of 16
# seconds, so a request for 30 is not refused, it is quietly reduced. A
# configuration file claiming 30 would be describing a watchdog that does
# not exist, and every timing in the acceptance table would be written
# against a number the board never used.
#
# This is the slow loop and the last one. bench-app's WatchdogSec catches a
# wedged application in 30 s, bench-failsafe catches an undecided boot in
# 120 s, and this catches a kernel that has stopped scheduling, which is
# the only one of the three that no userspace timer can see.
[Manager]
RuntimeWatchdogSec=14
