# A drop-in for mosquitto.service, Project 18.
#
# A drop-in rather than a replacement unit, because the only thing this
# project changes is which configuration file the broker reads. A
# replacement would quietly go on using an ExecStart that upstream had
# moved on from, and nobody would find out until a version bump.
#
# The access point's units are replacements for the opposite reason: their
# configuration is generated into /run at every boot, which is a different
# shape from what the hostapd recipe assumes.

[Unit]
# The broker binds the access point's own address, so that address has to
# exist first. Without this it starts, fails to bind, and restarts until
# systemd gives up, which reads in the log as a broker problem rather than
# as an ordering one.
After=bench-hostapd.service systemd-networkd.service
Wants=bench-hostapd.service

[Service]
# ExecStart is cleared before it is set. A drop-in appends to a list, and
# mosquitto.service already has an ExecStart, so without the empty
# assignment this unit would carry two of them: systemd refuses that
# outright for Type=notify, and where it does not, the second broker fails
# to bind the port the first one took.
ExecStart=
ExecStart=/usr/sbin/mosquitto -c /etc/bench/mosquitto.conf
