# Mosquitto, Project 18. One listener, TLS only, certificates as identity.
#
# Every line here is a decision. The ones that look like boilerplate are
# the ones that would silently undo the rest of the project if they were
# dropped, and they say so.

# THERE IS NO 1883 LISTENER, AND THAT IS THE FIRST DECISION.
#
# Mosquitto's default, with no listener line at all, is 1883 on every
# interface with anonymous access. So the absence of a plaintext listener
# is not achieved by not mentioning one: it is achieved by mentioning this
# one, because naming any listener switches the default off.
#
# A plaintext listener beside a TLS one is the one every client eventually
# uses by accident, and it fails open: the publish succeeds, the data is on
# the air in clear text, and nothing reports a problem.
listener 8883 10.18.0.1

# Bound to the access point's own address rather than 0.0.0.0. There is
# only one interface today; there may be a second the day somebody plugs in
# the USB adapter to debug something, and a broker that follows them onto
# it is a broker listening on the bench network.

# The private CA. Nothing else signs anything this broker will trust.
cafile /etc/bench/pki/ca.crt
certfile /etc/bench/pki/bench-ap.crt
keyfile /etc/bench/pki/bench-ap.key

# The revocation list, and this is the line that makes the CA load-bearing.
#
# Without crlfile, revoking a certificate changes a file on the laptop and
# nothing else: the revoked device keeps connecting, and the CRL machinery
# is theatre. Acceptance criterion 8 exists to prove this line works, and
# it is the criterion most likely to be assumed.
#
# Mosquitto reads the CRL at startup, so regenerating it is not enough on
# its own. bench-pki.sh says so when it revokes.
crlfile /etc/bench/pki/bench-ca.crl

# A client with no certificate is refused at the TLS layer, before MQTT.
require_certificate true

# The certificate's common name becomes the MQTT username, which is what
# connects authentication to authorisation.
#
# Without it the broker authenticates a certificate and then authorises an
# unrelated username, so the ACL below would be enforced against something
# the PKI never vouched for. That is the difference between a PKI that
# decorates a system and one that runs it.
use_identity_as_username true

# Belt and braces. require_certificate already makes an anonymous
# connection impossible, but the two settings fail differently, and this
# one is the difference between a misconfiguration being a closed door and
# being an open one.
allow_anonymous false

# TLS 1.2 as the floor. The ESP8266's stack does not do 1.3, and refusing
# everything below 1.2 is the part that matters.
tls_version tlsv1.2

acl_file /etc/bench/mosquitto.acl

# A ceiling on one message, in bytes.
#
# Authentication is not the same as trust. Every client here holds a
# certificate this bench issued, and one of them may still be a device
# somebody has taken over, or simply a firmware bug with a loop in it. The
# broker runs on a Pi with a gigabyte of RAM shared with everything else,
# and mosquitto's default is 256 MB, which one publish can reach.
#
# 64 kB is far above anything this bench sends. Project 17's records are
# tens of bytes and the position reports of Project 16 are smaller. The
# number is a bound on damage rather than a sizing estimate, which is why
# it is round and generous rather than tight.
message_size_limit 65536

# The same argument for connections. A device stuck in a reconnect loop is
# the ordinary cause, not an attack.
max_connections 20

# No persistence. This broker carries position reports and sensor readings
# that are worthless a minute later, and a persistence file on an SD card
# is a write cycle every few seconds for data nobody reads back.
persistence false

log_dest syslog
log_type error
log_type warning
log_type notice
# Connection logging is on because the acceptance criteria are mostly about
# who connected and who was refused, and the broker's log is the evidence.
connection_messages true
