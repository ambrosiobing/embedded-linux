# The whole packet path of the bench router, in one file.
#
# Read with: nft list ruleset
# Check without loading: nft -c -f /etc/bench/nftables.conf
#
# Two design points are worth stating because the obvious version of this
# file gets both wrong.
#
# 1. The masquerade rule names both uplinks. Failover therefore needs no
#    change here at all: whichever interface the default route currently
#    leaves by is the one whose address gets substituted. The only visible
#    effect of a switch-over is that long-lived flows die, because their
#    conntrack entries carry the old source address. That is what NAT
#    failover is, not a bug to be worked around.
#
# 2. There is an input chain with policy drop. Most published examples of
#    this setup have only forward and postrouting, which leaves the input
#    policy at accept: every service on the box, the SSH server and the
#    metrics endpoint included, is then reachable from the carrier network
#    as soon as the LTE bearer comes up. A router with a public-facing
#    uplink and no input policy is not a router, it is a target.

flush ruleset

table inet bench_router {
	chain input {
		type filter hook input priority filter; policy drop;

		ct state established,related accept
		ct state invalid drop
		iif lo accept

		# ICMP is not optional. Dropping it breaks path MTU discovery,
		# and a tunnel over LTE is exactly where a wrong MTU hurts.
		meta l4proto icmp accept
		meta l4proto ipv6-icmp accept

		# The bench LAN: DHCP and DNS from dnsmasq, ssh, and the
		# metrics endpoint. Nothing here is offered to an uplink.
		iifname "wlan0" udp dport { 53, 67 } accept
		iifname "wlan0" tcp dport 53 accept
		iifname "wlan0" tcp dport { 22, 9101 } accept

		# The wired side is the workshop network, so administration
		# over the cable stays possible. Delete this line and the box
		# is reachable only from its own access point.
		iifname "eth0" tcp dport 22 accept

		# Everything else, and in particular everything arriving on
		# wwan0, is counted and dropped. The counter is the evidence:
		# "nft list ruleset" after a night on LTE shows how much
		# unsolicited traffic a carrier address attracts.
		counter comment "dropped, mostly from the LTE side"
	}

	chain forward {
		type filter hook forward priority filter; policy drop;

		ct state established,related accept
		iifname "wlan0" oifname { "eth0", "wwan0" } accept

		# Clamp to the path MTU. The LTE bearer is usually 1430 or
		# 1500 and the access point is 1500; without this, a client
		# with a 1500 byte MSS opens a TCP connection that completes
		# the handshake and then stalls on the first large response,
		# which is the single most confusing failure mode of any
		# cellular gateway.
		tcp flags syn tcp option maxseg size set rt mtu

		counter comment "forward denied"
	}

	chain postrouting {
		type nat hook postrouting priority srcnat; policy accept;

		oifname { "eth0", "wwan0" } masquerade
	}
}
