# DHCP for the bench clients, on the access point only.
#
# bind-interfaces rather than the default wildcard bind: without it dnsmasq
# listens on every address including the LTE one, which is a resolver open
# to the carrier network.
interface=wlan0
bind-interfaces
dhcp-range=10.20.0.50,10.20.0.150,12h
dhcp-option=option:router,10.20.0.1
dhcp-option=option:dns-server,10.20.0.1
domain-needed
bogus-priv
