# A carrier is not connectivity. The cable can be plugged in, eth0 can have
# an address, and the home router can still have lost its own uplink.
#
# NetworkManager fetches this page through each device and penalises the
# metric of one that fails, so wwan0 takes over without the carrier ever
# having dropped. 60 s is the detection floor for that case; a carrier loss
# is still detected immediately, because that needs no fetch.
#
# Point the URI at your own server if you would rather not tell a third
# party how often this box is online.
[connectivity]
uri=http://nmcheck.gnome.org/check_network_status.txt
response=NetworkManager is online
interval=60
