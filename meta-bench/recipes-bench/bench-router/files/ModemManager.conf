# Strict filtering: probe only ports that are already known to belong to a
# modem, and never go hunting on a plain serial port.
#
# Without this, ModemManager probes /dev/ttyAMA0 as well, which on a Pi is
# the header UART and may be a login console or the HAT's fallback AT
# channel. Sending AT commands into a getty is a confusing way to lose an
# afternoon. The udev rules add ID_MM_PORT_IGNORE to the same ports, so the
# two mechanisms have to both fail before anything reaches the UART.
[filter]
policy=strict
