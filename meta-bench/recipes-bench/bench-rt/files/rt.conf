# Project 8: one place for the numbers that define a run.
#
# Everything here is read by rt-run and passed to the programs it starts,
# so a row of the results table can be reproduced from this file plus the
# arguments rt-run was given. Changing a value here changes every later
# run and none of the earlier ones, which is why each results file records
# the values it used rather than pointing back at this file.

# The core under test. Must be the core named in isolcpus, nohz_full and
# rcu_nocbs on the kernel command line; rt-run checks that and refuses to
# label a run "isolated" when the kernel disagrees.
RT_CPU=3

# The cores everything else is confined to. stress-ng, the capture process
# and the analysis all run here. This is the setting that stops the
# experiment from measuring itself.
RT_HOUSEKEEPING=0-2

# SCHED_FIFO priority of the toggler. 80 is below the 99 that kernel
# threads such as the timer softirq run at and above everything ordinary.
RT_PRIORITY=80

# Microseconds between edges. 1000 gives a 500 Hz square wave, so a 60 s
# run has 30000 rising edges for the analysis to find.
RT_TOGGLE_US=1000

# Seconds per run. Long enough for a 99.9th percentile to mean something
# at 1 kHz, short enough that a bare board does not throttle.
RT_DURATION=60

# The output pin. GPIO20 is header pin 38, which the MCC 118 does not use,
# and pin 39 is the ground next to it, so the jumper is short.
RT_GPIO_CHIP=/dev/gpiochip0
RT_GPIO_LINE=20

# The instrument. 100 kS/s single channel is the MCC 118 maximum, so one
# sample is 10 us and the edge timing comes from interpolation between two
# samples rather than from the sample rate. See docs/METHOD.md.
RT_DAQ_CHANNEL=0
RT_DAQ_RATE=100000

# Volts. The logic swing is 0 to 3.3 V and the threshold sits in the
# middle, where the edge is steepest and the interpolation is most linear.
RT_THRESHOLD=1.65

# Where the capture file is written while the run is in progress. A
# tmpfs, because the disk stressor and the capture writing to the same SD
# card produce stalls that belong to the card and get counted as jitter.
RT_SCRATCH=/dev/shm

# Where results are kept. On the rootfs, because rebooting between kernel
# rows is part of the method and a result that does not survive a reboot
# is not a result.
RT_RESULTS=/var/lib/bench/rt
