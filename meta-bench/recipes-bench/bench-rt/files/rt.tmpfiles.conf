# The results directory, created before anything writes to it.
#
# systemd-tmpfiles rather than a directory shipped in the package: a
# directory in the rootfs is owned by the package manager and disappears on
# an update, and the run scripts would then fail at the point where they
# have data to write, which is the worst moment to find out.
d /var/lib/bench 0755 root root -
d /var/lib/bench/rt 0755 root root -
