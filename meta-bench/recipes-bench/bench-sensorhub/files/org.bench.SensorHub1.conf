<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Who may own the name, and who may talk to it.

  This is the first of two authorisation layers and the coarse one. The
  bus answers "may this process talk to that name at all", before any
  message reaches the daemon. polkit answers the finer question, "may
  this caller run Calibrate", and it lives in
  org.bench.sensorhub.policy because that question is about a user rather
  than about a connection.

  Getting the split wrong in either direction is a common mistake: a
  daemon that checks the caller's uid in C has reimplemented the bus
  policy badly, and a bus policy that tries to express "only the bench
  group may calibrate" cannot, because it has no notion of an action.

  Installed to /usr/share/dbus-1/system.d/, which is where a package puts
  its policy. /etc/dbus-1/system.d/ is for the administrator to override
  it, and nothing this repository ships belongs there.
-->
<busconfig>

  <!-- Only the daemon's own user may claim the name. Without this the
       request fails at startup with "Connection is not allowed to own
       the service", which is the error that sends people looking in the
       daemon for a bug that is in this file. -->
  <policy user="sensorhub">
    <allow own="org.bench.SensorHub1"/>
  </policy>

  <!-- Everyone else may call and may receive the signals. That is
       deliberately open: the interface is read-mostly, SetRate is
       bounded and validated, and Calibrate is behind polkit. Narrowing
       this to a group would put the same rule in two places and make the
       polkit action decorative. -->
  <policy context="default">
    <allow send_destination="org.bench.SensorHub1"/>
    <allow receive_sender="org.bench.SensorHub1"/>
  </policy>

</busconfig>
