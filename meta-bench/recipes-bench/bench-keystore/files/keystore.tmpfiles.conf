# Where the secure world's storage ends up, and where the evidence goes.
#
# /var/lib/tee is not this project's choice: meta-arm builds optee-client
# with -DCFG_TEE_FS_PARENT_PATH='${localstatedir}/lib/tee', so the
# supplicant reads and writes there. Every document that says /data/tee
# is describing the OP-TEE default, which this package overrides.
#
# The directory is created here so that it exists before the first
# session rather than on the first write, and so that a reader of this
# file can find out where the key lives without reading a cmake flag.
#
# Deleting it destroys the key with no recovery. That is worth one line
# in a config file, because it is not recoverable and it is not obvious.
d /var/lib/tee 0700 root root -

# xtest reports, traces, timing tables. Kept out of /tmp so that they
# survive the reboot that provisioning asks for.
d /var/lib/bench 0755 root root -
d /var/lib/bench/tee 0755 root root -
