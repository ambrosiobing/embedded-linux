# Console keymap for the bench. The boards are used with a German keyboard
# on the local console, and the default US map puts = - / : " and | in
# places that make a shell unusable.
#
# systemd-vconsole-setup reads this at boot. Changing it on a running board
# is "loadkeys de" plus a rewrite of this file.
KEYMAP=de
FONT=eurlatgr
