# Project 17: the gateway's configuration, read by systemd as an
# EnvironmentFile and by stwin-gw as the default for every option.
#
# Nothing here is a secret. The MAC address of a sensor on this bench is
# not one, and the broker is on localhost. When Project 18 replaces that
# broker with one that has TLS and a private CA, the credentials go in a
# separate file with mode 600 and this one keeps the settings.

# The peripheral. Leave empty to take the first device that advertises the
# BlueST service, which is right for a bench with one sensor on it and
# wrong the moment there are two.
STWIN_MAC=

# The controller. Empty means whichever adapter BlueZ offers first, which
# on a Raspberry Pi is hci0 because there is only one.
STWIN_ADAPTER=

# Where the frames go. An empty broker disables MQTT and leaves the CSV
# file and the LEDs working, which is the right state for a first bring-up.
STWIN_BROKER=localhost
STWIN_PORT=1883
STWIN_TOPIC=bench/stwin

# StateDirectory=stwin-gw in the unit creates this and hands it to the
# service user, so this path and that line have to agree.
STWIN_CSV_DIR=/var/lib/stwin-gw

# The three link-state LEDs. Off by default: a board with nothing wired to
# GPIO5, 6 and 13 should not log an error on every start.
STWIN_LEDS=0
STWIN_LED_CHIP=/dev/gpiochip0

# Seconds. The scan gives up after this and goes into back-off; the stall
# timeout ends a connection that is still up and has stopped delivering,
# which a supervision timeout cannot detect. 0 disables it.
STWIN_SCAN_TIMEOUT=10
STWIN_STALL_TIMEOUT=30

# Filter the scan inside BlueZ instead of in the gateway. Lighter on the
# CPU, and it hides every advertisement that does not match, including the
# one you are looking for when something is wrong.
STWIN_FILTER_UUID=0

STWIN_LOG_LEVEL=info
