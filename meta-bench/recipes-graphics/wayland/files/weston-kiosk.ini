# weston.ini for the bench kiosk. Installed as /etc/xdg/weston/weston.ini.
#
# Nine lines of configuration replace the compositor the project
# specification would have packaged from source. See the bbappend beside
# this file for why weston rather than cage, and docs/DESIGN.md for the
# directory listings that settled it.

[core]
# "kiosk", not "kiosk-shell.so". Weston 13's weston.ini(5) takes the
# short name; the .so spelling is from older releases and is silently
# ignored here, which leaves the desktop shell running and a dashboard
# in a window with a title bar.
shell=kiosk

# require-input=false lets the compositor start before any input device
# has been probed. On this board the touch controller comes up through
# the panel's own microcontroller over I2C, which is not instant, and
# with the default weston refuses to start at all on a board whose
# screen is otherwise working.
require-input=false

# systemd-notify.so is NOT listed here: weston-init's unit passes it on
# the command line with --modules, and listing it in both places loads
# it twice. The unit is Type=notify and will hang at startup without it,
# so if this file is ever used with a different unit, that module has to
# come from somewhere.

[output]
# The official 7 inch DSI panel.
name=DSI-1

# ROTATION IS NOT SET HERE, ON PURPOSE.
#
# It is set once at the lowest layer, on the kernel command line:
#
#     video=DSI-1:800x480@60,panel_orientation=upside_down
#
# so that fbcon, the compositor and libinput's touch mapping all inherit
# the same answer. Setting transform=rotate-180 here as well would rotate
# the picture twice and leave the touch coordinates mapped to the first
# rotation, which presents as touch working correctly upside down: the
# hardest version of this bug to read.
#
# The firmware's legacy lcd_rotate=2 is a third place it could be set and
# a fourth answer; under KMS it is ignored entirely.

[autolaunch]
# The dashboard. The kiosk shell gives whatever it launches the whole
# output, so there is no "make it full screen" step anywhere.
path=/usr/bin/bench-hmi

# watch=true makes weston exit when the client does, which combined with
# Restart=always on the unit means a crashed dashboard restarts the whole
# session rather than leaving a live compositor showing nothing.
#
# That is the right behaviour for a kiosk and the wrong one for a
# desktop, and it is the single line that makes
# "systemctl restart weston" and "kill bench-hmi" have the same effect.
watch=true

[libinput]
# Touchscreens are absolute devices, so none of the pointer acceleration
# settings apply. The calibration matrix lives in udev, not here: see
# bench-kiosk's 99-bench-touch.rules for why a property on the device
# survives an application rebuild and a compositor change.
enable_tap=false
