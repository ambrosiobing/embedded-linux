# bluetoothd, configured for a gateway rather than for a laptop.
#
# Only the keys this bench actually decides. Everything absent uses the
# daemon's built-in default, which is the point: a reader can tell at a
# glance what was chosen, and the file does not have to be re-reviewed
# against a new BlueZ release line by line.
#
# Units matter more here than anywhere else in the repository and are the
# classic source of a link that behaves oddly rather than failing:
# connection intervals are in units of 1.25 ms, the supervision timeout in
# units of 10 ms. A value copied from a datasheet in milliseconds gives a
# link that is either absurdly slow or refused outright.

[General]
# No BR/EDR inquiry. This is an LE-only gateway, and a controller that is
# not also scanning for classic devices finds an advertiser sooner.
ControllerMode = le

# The gateway is a systemd service with no user session behind it, so
# nothing will ever run "power on" by hand.
[Policy]
AutoEnable = true

[LE]
# 15 ms to 30 ms. This is what the central proposes; the peripheral may
# answer with a connection parameter update request, which appears in
# btmon as an L2CAP signalling packet. What is written here is a
# preference, not a setting, and the trace is where the negotiated value
# is read.
MinConnectionInterval = 12
MaxConnectionInterval = 24

# Two seconds without a packet before the link is declared dead. This is
# the number the battery-removal test measures: pull the cell and the red
# LED should follow within this timeout plus the time it takes the
# supervisor to notice, which is one D-Bus signal.
ConnectionSupervisionTimeout = 200
