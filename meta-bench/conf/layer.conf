# meta-bench layer configuration.
#
# The layer holds bench hardware policy only: the image, the status-LED
# application and a kernel configuration fragment. Machine and distro
# selection live in kas/ and in the local.conf header, never here, so that
# the same layer can be used for raspberrypi4-64 and raspberrypi3-64.

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

# RECIPES THAT NEED A LAYER MOST CONFIGURATIONS DO NOT HAVE.
#
# BitBake parses every recipe in this layer for every configuration, not
# just the ones the target needs. Project 19's bundle does "inherit
# bundle", and bundle.bbclass belongs to meta-rauc, which only
# kas/bench-rpi3-ab.yml brings in. The rauc-conf bbappend has the same
# shape: it appends a recipe that does not exist elsewhere.
#
# The result was not a skipped recipe, it was a halt:
#
#     ERROR: ParseError at .../bench-bundle.bb:12:
#            Could not inherit file classes/bundle.bbclass
#     ERROR: Parsing halted due to errors
#
# for EVERY configuration in the repository, found on Monday 21 September
# 2026 when ./go tee could no longer parse. One project's optional
# dependency stopped every other project from building.
#
# BBFILES_DYNAMIC is the mechanism for this and meta-raspberrypi uses it
# the same way: the recipes live under dynamic-layers/<layer>/ and are
# parsed only when that layer's collection is present. "rauc" is
# meta-rauc's BBFILE_COLLECTIONS name, not a directory name, which is why
# the prefix and the path spell it differently.
BBFILES_DYNAMIC += " \
    rauc:${LAYERDIR}/dynamic-layers/meta-rauc/recipes-*/*/*.bb \
    rauc:${LAYERDIR}/dynamic-layers/meta-rauc/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "bench"
BBFILE_PATTERN_bench = "^${LAYERDIR}/"
BBFILE_PRIORITY_bench = "10"

LAYERDEPENDS_bench = "core openembedded-layer raspberrypi"
LAYERSERIES_COMPAT_bench = "scarthgap"

# Recipes in this layer that other layers may need to find by name.
LAYERVERSION_bench = "1"
