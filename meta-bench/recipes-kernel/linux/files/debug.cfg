# Project 9: the debugging toolbox.
#
# Opt in, and it has to be, because almost every symbol here costs
# something that the rest of this repository measures. DEBUG_INFO alone
# takes vmlinux from about 20 MB to well over 100 MB; the function
# tracer adds a call to every function in the kernel; lockdep adds work
# to every lock acquisition. Project 3 measures boot time and kernel size
# and Project 8 measures scheduling latency, and both would be measuring
# this fragment instead of what they think they are measuring.
#
# Every symbol below was read out of the tree at rpi-6.6.y before it was
# written here. That pass found four symbols that a fragment CANNOT set,
# which are listed at the bottom under "consequences". Three of them were
# in the original specification for this project as though they were
# requests. They are not: a promptless symbol takes its value from
# whatever selects it, and writing it in a fragment produces no error, no
# warning, and no effect.
#
# That is the whole reason this file is annotated the way it is. A
# fragment is a list of requests, and a request the kernel silently
# ignores looks exactly like one it granted.

# --- the debugger --------------------------------------------------------
# lib/Kconfig.kgdb:
#   menuconfig KGDB            bool "KGDB: kernel debugger"
#                                depends on HAVE_ARCH_KGDB
#                                depends on DEBUG_KERNEL
#   config KGDB_SERIAL_CONSOLE tristate "KGDB: use kgdb over the serial console"
#                                depends on TTY && HW_CONSOLE
#                                select CONSOLE_POLL
#                                select MAGIC_SYSRQ
#
# KGDB depends on DEBUG_KERNEL, so DEBUG_KERNEL is a request here and not
# a consequence: without it the debugger is not merely off, it is absent
# from the menu and the fragment is quietly dropped.
CONFIG_DEBUG_KERNEL=y
CONFIG_KGDB=y
CONFIG_KGDB_SERIAL_CONSOLE=y

# kdb is the frontend that works when no host is attached. It is worth
# the space: the common failure on this bench is a board that has stopped
# with nobody at the other end of the cable, and kdb turns that into a
# prompt on the console rather than a reboot. gdb over 5551 is the better
# tool when the host is ready; kdb is the one that is already there.
CONFIG_KGDB_KDB=y
CONFIG_KDB_DEFAULT_ENABLE=0x1

# KGDB_HONOUR_BLOCKLIST keeps a breakpoint out of the functions that kgdb
# itself runs in. Without it, a breakpoint on the wrong function takes the
# debugger down with the kernel and the board is a reset button away.
CONFIG_KGDB_HONOUR_BLOCKLIST=y

# NOT asked for: CONFIG_KGDB_LOW_LEVEL_TRAP. It reads as though it would
# help here, and it cannot: lib/Kconfig.kgdb makes it "depends on X86 ||
# MIPS", so on arm64 it is not available at any setting. Named here so
# that the next reader does not spend an afternoon on it.

# --- magic SysRq ---------------------------------------------------------
# The way into the debugger from a board that is still running, and the
# way out of several situations where it is not. MAGIC_SYSRQ is selected
# by KGDB_SERIAL_CONSOLE above, so the =y is an assertion; the other two
# are genuine requests.
#
# MAGIC_SYSRQ_SERIAL matters more than it looks: without it the break
# sequence on the serial line does nothing, and "echo g >
# /proc/sysrq-trigger" is then the only way in, which is no use at all
# when the thing you want to debug is a shell that will not return.
CONFIG_MAGIC_SYSRQ=y
CONFIG_MAGIC_SYSRQ_SERIAL=y

# 0x1ff is every SysRq function, rather than the kernel's default of 0x1.
# This is a debug image on a bench with the console cable in reach, so
# the argument for a restrictive mask does not apply, and the alternative
# is discovering which bit gates "g" at the moment the board has stopped.
# It is also settable at runtime through /proc/sys/kernel/sysrq.
CONFIG_MAGIC_SYSRQ_DEFAULT_ENABLE=0x1ff

# --- symbols, and the scripts that use them ------------------------------
# DEBUG_INFO itself is promptless. See "consequences" at the bottom. The
# settable symbol is the member of the "Debug information" choice, and
# DWARF5 is chosen because the gdb in scarthgap reads it and it is
# smaller than DWARF4 for the same content.
CONFIG_DEBUG_INFO_DWARF5=y
# Written the "is not set" way rather than as =n, which is the spelling
# the rest of this directory uses and the one merge_config.sh treats as a
# deliberate disable rather than an unset symbol.
# CONFIG_DEBUG_INFO_REDUCED is not set
CONFIG_GDB_SCRIPTS=y
CONFIG_KALLSYMS=y
CONFIG_KALLSYMS_ALL=y

# --- ftrace --------------------------------------------------------------
# FTRACE is the menuconfig ("Tracers"); everything under it is separate.
# IRQSOFF_TRACER is the one this project is really for: it is the only
# tool here that finds the "lock" fault, which produces no oops, no
# message and no crash.
CONFIG_FTRACE=y
CONFIG_FUNCTION_TRACER=y
CONFIG_FUNCTION_GRAPH_TRACER=y
CONFIG_DYNAMIC_FTRACE=y
CONFIG_IRQSOFF_TRACER=y
CONFIG_SCHED_TRACER=y
CONFIG_STACK_TRACER=y
CONFIG_FTRACE_SYSCALLS=y
CONFIG_TRACER_SNAPSHOT=y
CONFIG_BLK_DEV_IO_TRACE=y

# PREEMPT_TRACER depends on PREEMPTION. The Raspberry Pi defconfig sets
# CONFIG_PREEMPT, so this resolves; on a kernel built without preemption
# it would be dropped, silently, like everything else a fragment asks for
# and cannot have. ./go kconfig is what catches that.
CONFIG_PREEMPT_TRACER=y

# Dynamic events. KPROBES needs MODULES, which this image has anyway
# because the faulty module is one. UPROBE_EVENTS is the settable symbol;
# UPROBES is not, and asking for it is one of the four no-ops.
CONFIG_KPROBES=y
CONFIG_KPROBE_EVENTS=y
CONFIG_UPROBE_EVENTS=y

# --- perf ----------------------------------------------------------------
# PERF_EVENTS is the subsystem. ARM_PMU is the thing that gives it real
# counters rather than software events only, and it is settable
# (drivers/perf/Kconfig gives it the prompt "ARM PMU framework"). Without
# ARM_PMU, perf still runs and reports task-clock and context-switches,
# and silently has no cycles or cache misses, which is the least useful
# possible failure mode: a working tool with half its instruments.
CONFIG_PERF_EVENTS=y
CONFIG_ARM_PMU=y

# --- pstore, the crash that survives the reboot --------------------------
# The console scrolls past an oops and the board reboots ten seconds
# later. Pstore is what makes that recoverable. PSTORE_RAM is the backend
# that writes into a reserved region of ordinary DRAM, which keeps its
# contents across a warm reset.
#
# The region itself is NOT configured here. It comes from the ramoops
# device tree overlay named in config.txt, because its address has to be
# a region the kernel's page allocator never touches, and that is a
# property of the board's memory map rather than of the kernel.
CONFIG_PSTORE=y
CONFIG_PSTORE_RAM=y
CONFIG_PSTORE_DEFLATE_COMPRESS=y

# PSTORE_CONSOLE keeps ordinary console output, not just the panic, which
# is what catches a crash that printed something useful and then died
# before the oops. It needs a region, and the region comes from the
# overlay's console-size parameter: the default is 0, so this symbol on
# its own produces a feature with nowhere to write. kas/bench-debug.yml
# sets console-size for exactly this reason.
CONFIG_PSTORE_CONSOLE=y

# NOT asked for: CONFIG_PSTORE_PMSG. It would give userspace /dev/pmsg0
# to log into, and the ramoops overlay in the Raspberry Pi tree has no
# pmsg-size parameter, so there is no way to give it a region from
# config.txt. The symbol would build, the device would not appear, and
# the reason would be three layers away from the symptom.
# CONFIG_PSTORE_PMSG is not set

# PANIC_ON_OOPS turns an oops into a panic, which is what gets it written
# to pstore rather than merely printed. It is right for a debug image and
# wrong for anything else, which is another reason this fragment is opt
# in. It can be turned off at runtime through
# /proc/sys/kernel/panic_on_oops without a rebuild.
CONFIG_PANIC_ON_OOPS=y

# --- the detectors that need no trigger ----------------------------------
# PROVE_LOCKING is lockdep. It is the one tool here that finds a class of
# bug rather than an instance: it complains about a lock ordering that
# COULD deadlock, on a run where it did not. LOCKDEP itself is promptless
# and is selected by this; see the bottom.
CONFIG_PROVE_LOCKING=y
CONFIG_DEBUG_ATOMIC_SLEEP=y
CONFIG_DEBUG_SPINLOCK=y
CONFIG_DEBUG_MUTEXES=y
CONFIG_DEBUG_RT_MUTEXES=y

# SOFTLOCKUP_DETECTOR is the settable symbol. LOCKUP_DETECTOR is not, and
# this is the fourth no-op: it is a bare "bool" in lib/Kconfig.debug with
# no prompt at all, selected by this one.
CONFIG_SOFTLOCKUP_DETECTOR=y
CONFIG_DETECT_HUNG_TASK=y
CONFIG_WQ_WATCHDOG=y

# --- the cheap half of memory debugging ----------------------------------
# kmemleak and KFENCE are here, in the ordinary debug image, and KASAN is
# not. The split is by cost and it is the reason there are two images:
#
#   kmemleak   bookkeeping per allocation and a scan when asked. Finds
#              the "leak" fault. Expensive enough to matter, cheap enough
#              that the lab is still usable with it on.
#   KFENCE     samples a few allocations and guards those. Cheap by
#              design, which is its whole argument: it is the one tool
#              here that can be left enabled on something that ships.
#   KASAN      shadows every byte of memory at a ratio of one to eight.
#              On a 1 GB Pi 3 that is 128 MB gone before userspace
#              starts, plus roughly a factor of two on everything. It
#              gets its own image; see kasan.cfg.
#
# So three of the four faults are reachable from this one image, and only
# "uaf" needs the other. That is a deliberate choice about how the lab
# runs, not an accident of which symbols are cheap.
CONFIG_DEBUG_KMEMLEAK=y
CONFIG_DEBUG_KMEMLEAK_MEM_POOL_SIZE=16000

# Auto scan stays on, which is the kernel default. The notebook still
# runs an explicit "echo scan > /sys/kernel/debug/kmemleak" before
# reading a result, because the automatic scan's timing is not something
# a lab entry can depend on: a report that appears on its own schedule
# cannot be attributed to the trigger that caused it.
CONFIG_DEBUG_KMEMLEAK_AUTO_SCAN=y
# CONFIG_DEBUG_KMEMLEAK_DEFAULT_OFF is not set

# KFENCE: arch/arm64/Kconfig selects HAVE_ARCH_KFENCE, so it is available
# here. 100 ms is the upstream default sample interval; at that rate it
# will not reliably catch a fault triggered once by hand, which is the
# point of including it next to KASAN rather than instead of it.
CONFIG_KFENCE=y
CONFIG_KFENCE_SAMPLE_INTERVAL=100
CONFIG_KFENCE_NUM_OBJECTS=255

# SLUB_DEBUG is the allocator's own cheap checking: redzones and poison
# on demand, off until asked for with slub_debug= on the command line.
CONFIG_SLUB_DEBUG=y

# --- the filesystems the tools need --------------------------------------
# DEBUG_FS carries both the ftrace interface and the faulty module's
# trigger file. PROC_FS carries /proc/sysrq-trigger, the way into the
# debugger. Neither is optional for this image and both are in the
# defconfig already; they are asserted so that ./go kconfig notices if a
# future defconfig drops one.
CONFIG_DEBUG_FS=y
CONFIG_PROC_FS=y

# The heartbeat LED, which is the only instrument that still reports once
# the kernel has stopped scheduling. Built in rather than modular for the
# reason the other fragments give: this image would have to install a
# kernel-module package to get it otherwise, and a missing LED trigger
# looks identical to a working one on a board that has crashed.
CONFIG_NEW_LEDS=y
CONFIG_LEDS_CLASS=y
CONFIG_LEDS_GPIO=y
CONFIG_LEDS_TRIGGERS=y
CONFIG_LEDS_TRIGGER_HEARTBEAT=y

# =========================================================================
# CONSEQUENCES: symbols this fragment CANNOT set, asserted so that a
# change to the defconfig cannot remove them without ./go kconfig saying
# so. Every one of these is promptless. Writing it as a request is legal,
# silent and useless.
#
#   CONFIG_DEBUG_INFO       lib/Kconfig.debug, bare "bool". Selected by
#                           the members of the "Debug information"
#                           choice. Ask for DEBUG_INFO_DWARF5 instead.
#   CONFIG_CONSOLE_POLL     lib/Kconfig.kgdb, bare "bool". Selected by
#                           KGDB_SERIAL_CONSOLE. This is the one that
#                           makes the UART driver expose poll_get_char
#                           and poll_put_char, which is what lets the
#                           debugger use a port the console also uses.
#   CONFIG_HW_PERF_EVENTS   arch/arm64/Kconfig, "def_bool y depends on
#                           ARM_PMU". Ask for ARM_PMU instead.
#   CONFIG_UPROBES          arch/Kconfig, "def_bool n". Selected by
#                           UPROBE_EVENTS. Ask for that instead.
#   CONFIG_LOCKDEP          lib/Kconfig.debug, bare "bool". Selected by
#                           PROVE_LOCKING.
#   CONFIG_LOCKUP_DETECTOR  lib/Kconfig.debug, bare "bool". Selected by
#                           SOFTLOCKUP_DETECTOR.
# =========================================================================
CONFIG_DEBUG_INFO=y
CONFIG_CONSOLE_POLL=y
CONFIG_HW_PERF_EVENTS=y
CONFIG_UPROBES=y
CONFIG_LOCKDEP=y
CONFIG_LOCKUP_DETECTOR=y
