# Project 14: the USB gadget stack, built in rather than loaded.
#
# Opt in, because it changes what the USB-C port is. With this fragment
# and the dwc2 overlay the port stops being a power inlet and becomes a
# peripheral-mode data port, and a board configured that way does not
# power up from an ordinary supply in the usual way. Every other image in
# this repository wants the stock behaviour.
#
# WHY BUILT IN AND NOT MODULES
#
# The project specification loads two modules from
# /etc/modules-load.d/gadget.conf, which is right on Raspberry Pi OS. On
# this image it would produce a board with no gadget at all:
# bench-image is built on core-image-minimal, WHICH INSTALLS NO KERNEL
# MODULES, and in bcm2711_defconfig
#
#     CONFIG_USB_GADGET=y      the framework is built in
#     CONFIG_USB_DWC2=m        the controller driver is not
#     CONFIG_USB_CONFIGFS=m    nor is the configfs interface
#
# Project 13 met the same trap and could NOT answer it this way, because
# DRM_VC4 depends on SND, which is itself a module, and a tristate that
# depends on a module can be at most a module. That was checked here
# before this file was written and the answer is different:
#
#     config USB_DWC2      tristate, depends on USB || USB_GADGET
#     config USB_CONFIGFS  tristate, select USB_LIBCOMPOSITE
#
# with CONFIG_USB=y and CONFIG_USB_GADGET=y already, so =y is reachable
# for both. Nothing in this file is a wish.
#
# Since these are built in, /etc/modules-load.d/gadget.conf is
# deliberately NOT shipped. Asking modules-load to load a built-in leaves
# a failure in the journal for a module that is doing its job, which is a
# confusing thing to find while debugging an enumeration problem.

# --- the controller ------------------------------------------------------
# dwc2 is the SoC's own dual-role controller, wired to the USB-C port.
# The USB-A ports are behind a separate host-only controller and are not
# affected by anything here.
CONFIG_USB_DWC2=y

# DUAL_ROLE rather than PERIPHERAL, and this is deliberate.
#
# drivers/usb/dwc2/Kconfig makes the mode a choice, and
#
#     default USB_DWC2_DUAL_ROLE if (USB && USB_GADGET)
#
# so this is already what the defconfig resolves to. It is written here
# as a request rather than left implicit because the ACTUAL mode is
# selected at runtime by the device tree:
#
#     dtoverlay=dwc2,dr_mode=peripheral
#
# Building the driver as PERIPHERAL only would work for this project and
# would silently break the overlay's host and otg modes for anyone who
# reused this fragment. Dual role costs a little text and keeps the
# device tree in charge, which is where the specification puts it.
CONFIG_USB_DWC2_DUAL_ROLE=y

# --- the configfs interface ---------------------------------------------
# This is the one that turns a directory tree into USB descriptors. It
# selects USB_LIBCOMPOSITE, which selects CONFIGFS_FS; both are asserted
# at the bottom rather than requested.
CONFIG_USB_CONFIGFS=y

# --- the three functions -------------------------------------------------
# All four of these are "bool" WITH a prompt, so they are genuine
# requests. Each one selects a promptless function driver.
#
# ECM and NCM are both built: they are the same capability for different
# hosts, chosen at runtime by which function directory the script makes.
# ECM has no in-box driver on Windows; NCM does. Building only one would
# make the host operating system a build-time decision, which is the
# wrong place for it when the same board is plugged into both.
CONFIG_USB_CONFIGFS_ECM=y
CONFIG_USB_CONFIGFS_NCM=y
CONFIG_USB_CONFIGFS_ACM=y
CONFIG_USB_CONFIGFS_F_HID=y

# --- what the host side of the bridge needs ------------------------------
# The physical keyboard arrives on a USB-A port, through the OTHER
# controller, and reaches the bridge as an evdev device. INPUT_EVDEV is
# already =y in the defconfig; the HID pieces are not named there at all
# and are asserted as requests because the bridge cannot work without
# them.
CONFIG_INPUT_EVDEV=y
CONFIG_USB_HID=y
CONFIG_HID_GENERIC=y

# =========================================================================
# CONSEQUENCES: symbols this fragment CANNOT set, asserted so that a
# change to the defconfig cannot remove them without ./go kconfig saying
# so. Every one is a bare "tristate" with no prompt string, which means
# its value comes from whatever selects it. Writing one as a request is
# legal, silent and useless.
#
# This is the same finding as Project 9's four promptless Kconfig
# symbols, and there are seven of them here.
#
#   CONFIG_USB_LIBCOMPOSITE  selected by USB_CONFIGFS. The thing that
#                            actually builds the descriptor tree.
#   CONFIG_CONFIGFS_FS       selected by USB_LIBCOMPOSITE. Without it
#                            there is no /sys/kernel/config to mkdir in.
#   CONFIG_USB_F_ECM         selected by USB_CONFIGFS_ECM
#   CONFIG_USB_F_NCM         selected by USB_CONFIGFS_NCM
#   CONFIG_USB_F_ACM         selected by USB_CONFIGFS_ACM
#   CONFIG_USB_F_HID         selected by USB_CONFIGFS_F_HID
#   CONFIG_USB_U_ETHER       the shared ethernet helper, selected by the
#                            ECM and NCM functions
#   CONFIG_USB_U_SERIAL      the shared serial helper, selected by ACM
# =========================================================================
CONFIG_USB_LIBCOMPOSITE=y
CONFIG_CONFIGFS_FS=y
CONFIG_USB_F_ECM=y
CONFIG_USB_F_NCM=y
CONFIG_USB_F_ACM=y
CONFIG_USB_F_HID=y
CONFIG_USB_U_ETHER=y
CONFIG_USB_U_SERIAL=y
