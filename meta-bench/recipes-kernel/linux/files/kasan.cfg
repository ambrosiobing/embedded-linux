# Project 9: KASAN, which is expensive enough to need its own image.
#
# This fragment is additive to debug.cfg, not a replacement for it. The
# kas file that turns it on turns both on, because a KASAN kernel with no
# console, no pstore and no symbols would report a use after free onto a
# serial line nobody is reading.
#
# WHAT IT COSTS, since that is the reason for the separation:
#
#   Shadow memory at one byte per eight. The Pi 3B+ has 1 GB, so about
#   128 MB is gone before userspace starts.
#   Instrumentation on every load and store the compiler can see, which
#   is roughly a factor of two on kernel time, and more on anything
#   allocation heavy.
#   A larger vmlinux, because every access grows a check.
#
# None of that is a reason to avoid it. It is the reason not to leave it
# on in the image that Project 3 measures boot time with, and not to
# leave it on in the image the ftrace work is done in, because a
# latency figure taken under KASAN is a figure about KASAN.
#
# Every symbol was read out of lib/Kconfig.kasan at rpi-6.6.y.

# --- the detector --------------------------------------------------------
# menuconfig KASAN, whose dependency chain is long and worth knowing:
#
#   depends on (((HAVE_ARCH_KASAN && CC_HAS_KASAN_GENERIC) || ...
#                CC_HAS_WORKING_NOSANITIZE_ADDRESS) || HAVE_ARCH_KASAN_HW_TAGS
#   depends on (SLUB && SYSFS && !SLUB_TINY) || (SLAB && !DEBUG_SLAB)
#   select STACKDEPOT_ALWAYS_INIT
#
# arch/arm64/Kconfig selects HAVE_ARCH_KASAN except on 16K pages with a
# 48-bit VA, which is not this board's configuration, so it is available.
# The allocator clause is the one to watch: a future defconfig that sets
# SLUB_TINY would take KASAN out, and the visible symptom would be an
# image that builds and never reports anything.
CONFIG_KASAN=y

# --- which flavour -------------------------------------------------------
# A choice of three. GENERIC is the one that works with GCC, which is
# what this layer builds with.
#
#   KASAN_GENERIC   GCC or Clang, shadow based, catches the most.
#   KASAN_SW_TAGS   Clang only here, and arm64 top-byte-ignore.
#   KASAN_HW_TAGS   needs ARM64_MTE, which is Armv8.5. The BCM2837 is
#                   Cortex-A53, Armv8.0. Not available on this board at
#                   any setting, and worth writing down because it is the
#                   cheap one and the obvious thing to reach for.
CONFIG_KASAN_GENERIC=y

# --- outline or inline ---------------------------------------------------
# OUTLINE calls a helper on every access; INLINE emits the check inline
# and is roughly twice as fast for a considerably larger kernel.
#
# OUTLINE is chosen here, and the reason is not performance: it keeps
# vmlinux small enough that the existing boot path on this board does not
# have to change, and this project already changes the boot path in three
# other places (ramoops, kgdboc, nokaslr). A lab that alters one thing at
# a time is easier to trust than a fast one.
CONFIG_KASAN_OUTLINE=y

# --- what else to instrument ---------------------------------------------
# KASAN_STACK catches an out of bounds access to a stack local. It is
# left on: the faulty module has no stack fault today, but the cost is
# already paid by the time KASAN is on at all.
#
# KASAN_VMALLOC covers the vmalloc region, which is where a module's own
# code and data live. This project's faults are in a module, so without
# this the tool would be blind in exactly the address range the lab uses.
CONFIG_KASAN_STACK=y
CONFIG_KASAN_VMALLOC=y

# --- what is deliberately off --------------------------------------------
# The KUnit tests are a self test of KASAN rather than of anything this
# project builds. They are useful once, to confirm the detector really is
# detecting, and the notebook does that with the faulty module instead,
# which is the same evidence about a fault this repository owns.
# CONFIG_KASAN_KUNIT_TEST is not set
# CONFIG_KASAN_MODULE_TEST is not set

# =========================================================================
# CONSEQUENCES: promptless, asserted rather than requested.
#
#   CONFIG_STACKDEPOT_ALWAYS_INIT   selected by KASAN. It is what makes
#                                   the allocation and free stacks in a
#                                   KASAN report available at all, which
#                                   is the entire value of the report
#                                   over a plain "bad access here".
# =========================================================================
CONFIG_STACKDEPOT_ALWAYS_INIT=y
