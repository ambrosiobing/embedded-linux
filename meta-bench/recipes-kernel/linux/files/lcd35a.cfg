# Project 7: a Waveshare 3.5 inch RPi LCD (A) as a DRM device with touch.
#
# EVERY SYMBOL BELOW WAS READ OUT OF THE v6.12 SOURCE BEFORE IT WAS
# WRITTEN, with the file and line recorded in
# projects/07-lcd35-drm/docs/DESIGN.md. Run the check again against the
# tree that will actually be built, because this fragment was written on a
# laptop that has no kernel tree:
#
#     ./go ksym -f lcd35a        every line names a symbol that exists
#     ./go kconfig -f lcd35a     every line reached the .config
#
# A fragment line naming a symbol nobody declares is silently ignored: the
# build succeeds, the option is absent, and the board disagrees a week
# later. This repository has paid for that once with three invented
# netfilter symbols that survived review, CI and a 178 minute build.
#
# WHY EVERYTHING HERE IS =y
#
# The same argument as explorer.cfg next door. core-image-minimal installs
# no kernel modules at all, so a driver built as a module is present in the
# build tree and absent from the image, and the symptom is hardware that
# does not exist with nothing anywhere saying why.
#
# On this image nothing is optional. The product is one overlay binding two
# SPI slaves, and either one missing makes the project fail its acceptance
# criteria outright.

# --- the bus controller ------------------------------------------------
#
# Named first, because the Raspberry Pi 3 defconfig builds it as a module:
#
#     CONFIG_SPI_BCM2835=m
#
# and an image that named both drivers and forgot the controller would have
# no SPI bus at all. Not one missing device: both of them, presenting as a
# panel that is not plugged in. Project 8 lost a flash and a boot to this
# exact shape, asking for kernel-module-spidev and not for the controller
# spidev attaches to.
CONFIG_SPI_BCM2835=y

# --- the dependency that can silently defeat a line below ---------------
#
# TOUCHSCREEN_ADS7846 is declared with
#
#     depends on HWMON = n || HWMON
#
# which is a tristate dependency, not a boolean one. It means the driver
# may be built in only when HWMON is itself built in, or absent entirely.
# If the defconfig carries CONFIG_HWMON=m, then CONFIG_TOUCHSCREEN_ADS7846=y
# is not a valid configuration, Kconfig drops it without a word, and the
# board has no touch input with nothing in any log explaining it.
#
# So HWMON is pinned here rather than hoped for. It costs a few kilobytes
# and it removes a failure that would otherwise be invisible until a finger
# touched the glass. The driver also uses it: told the reference voltage,
# ads7846 exposes the chip's voltage and temperature sensors through hwmon.
#
# THIS LINE IS THE ONE TO CHECK FIRST if touch does not work. It is
# reasoning from the Kconfig stanza; nobody has yet read what HWMON is set
# to in the Raspberry Pi 3 defconfig.
CONFIG_HWMON=y

# --- the panel ----------------------------------------------------------
#
# DRM is =m in the Pi 3 defconfig, and Kconfig will not allow a =y symbol
# to depend on a =m one. The quiet result of trying is a fragment line that
# does not take effect, so DRM is forced built in first and the driver
# line below is legal as a consequence.
#
# vc4 is deliberately not touched. It stays whatever the BSP makes it,
# which keeps HDMI available for the first boots before fbcon is moved to
# the panel.
CONFIG_DRM=y

# The tiny driver for this exact board. Its compatible list carries
# "waveshare,rpi-lcd-35", read out of drivers/gpu/drm/tiny/ili9486.c.
#
# It is the right driver rather than the generic panel-mipi-dbi one
# because the panel board does not wire the controller's serial interface
# to SPI: shift registers convert the stream to the ILI9486's 16-bit
# parallel bus, so every command and every data byte has to go out as a
# 16-bit word. This driver widens them; panel-mipi-dbi sends 8-bit
# commands and cannot drive this board whatever the device tree says.
#
# Not named here, because TINYDRM_ILI9486 selects all four:
# DRM_KMS_HELPER, DRM_GEM_DMA_HELPER, DRM_MIPI_DBI, BACKLIGHT_CLASS_DEVICE.
# A fragment that names selected symbols is noise somebody later has to
# keep true.
CONFIG_TINYDRM_ILI9486=y

# --- the touch controller -----------------------------------------------
#
# The XPT2046 on the panel is register compatible with the TI ADS7846 and
# the in-tree driver handles it, including the pen-down interrupt on
# GPIO17. See the HWMON note above before believing this line took effect.
CONFIG_TOUCHSCREEN_ADS7846=y

# evdev is what makes the touch controller reachable as
# /dev/input/eventN. Already =y in the defconfig; named because every
# acceptance criterion involving touch goes through it.
CONFIG_INPUT_EVDEV=y

# --- the console on the panel -------------------------------------------
#
# DRM_FBDEV_EMULATION is the shim that gives a DRM device a /dev/fbN node.
# Without it the panel works, there is no framebuffer, con2fbmap has
# nothing to map, and acceptance criterion 2 is not reachable at all.
#
# It also pulls the rest of the chain on its own: drivers/gpu/drm/Kconfig
# has "select FB_CORE if DRM_FBDEV_EMULATION" on the DRM symbol, and
# FRAMEBUFFER_CONSOLE is "default DRM_FBDEV_EMULATION". Both are named
# anyway, because a default is a statement about today's Kconfig and this
# project has an acceptance criterion riding on them.
CONFIG_DRM_FBDEV_EMULATION=y
CONFIG_FRAMEBUFFER_CONSOLE=y

# 8x8 gives 60x40 characters on 480x320, which is enough for a login
# prompt and a readable dmesg. It is "default y if !SPARC && !FONTS", so
# on this board it is very likely already set and this line is the check
# doing its job rather than a change.
CONFIG_FONT_8x8=y
