# Project 20: the OP-TEE driver, as a module. The debugging answer.
#
# Read tee.cfg first; it carries the subsystem and the reasoning, and it
# is merged alongside whichever of this file and tee-builtin.cfg the
# bbappend selects. Exactly one of the two is ever in SRC_URI.
#
# WHY THIS EXISTS. On Tuesday 22 September 2026 the board booted the
# secure world correctly and then wedged the CPU that called into it,
# during optee_bus_scan, which runs once at probe. Built in, that probe
# happens while the kernel is still bringing up drivers, so the machine
# dies before there is a shell, a login, or a dmesg anybody can read. Four
# boots narrowed the fault to the driver's own calls and could not go
# further, because every question after that one needs a running system
# to ask it from. Journal entries 20, 21 and 23.
#
# As a module the same board boots to a login prompt with TF-A and OP-TEE
# resident underneath it, and the failure moves to the moment somebody
# types modprobe. That is the whole point: a fault you can trigger is a
# fault you can bisect.
#
# TWO THINGS THIS FRAGMENT IS NOT SUFFICIENT ON ITS OWN FOR.
#
# The module has to be in the image. core-image-minimal installs no
# kernel modules, so bench-tee-modular-image.bb names kernel-module-optee
# explicitly. Without it the build succeeds, the card boots, and modprobe
# says the module is not found.
#
# And the module must not load itself. The driver carries an OF match on
# "linaro,optee-tz", so with /firmware/optee in the device tree udev
# autoloads it during boot and reproduces exactly the failure this
# fragment exists to escape. Boot with modprobe.blacklist=optee on the
# kernel command line; blacklisting stops the alias-driven load and
# leaves an explicit "modprobe optee" working. docs/BRINGUP.md says where
# to put that.
CONFIG_OPTEE=m
