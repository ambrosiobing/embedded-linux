# Project 20: the OP-TEE driver, built in. The shipped answer.
#
# Read tee.cfg first; it carries the subsystem and the reasoning, and it
# is merged alongside whichever of this file and tee-modular.cfg the
# bbappend selects. Exactly one of the two is ever in SRC_URI, because a
# second fragment setting the same symbol to a different value is an
# override that merge_config warns about and that ./go kconfig then
# reports as a fragment line which never reached .config.
#
# Built in is right for the product. The driver's job is to find a secure
# world that the boot chain placed before Linux existed, and a module
# that has to be installed, packaged and loaded adds three ways for that
# to silently not happen. core-image-minimal installs no kernel modules
# at all, so =m without a matching kernel-module-optee in the image is a
# driver that is present in the build tree, absent from the card, and
# indistinguishable at the console from a secure world that never booted.
#
# Use tee-modular.cfg instead when the driver is the thing under
# investigation rather than the thing being used. See kas/bench-tee.yml
# and kas/bench-tee-modular.yml.
CONFIG_OPTEE=y
