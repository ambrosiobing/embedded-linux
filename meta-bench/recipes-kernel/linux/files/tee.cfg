# Project 20: what Linux needs in order to find a secure world at all.
#
# Opt in, for the reason the other fragments in this directory give at
# length. Built in rather than modular is the usual answer here too, and
# for the usual reason: core-image-minimal installs no kernel modules, so
# =m is a driver that exists in the build tree and is absent from the
# image. Here it matters more than usual, because the symptom is a dmesg
# with no optee line, which is also the symptom of a device tree without
# the firmware node and of a boot that never reached the secure world.
# Three causes, one appearance.
#
# The driver symbol itself is therefore NOT in this file. It lives in a
# sibling, one file per answer, tee-builtin.cfg and tee-modular.cfg, and
# the bbappend picks exactly one. That split exists because on Tuesday 22
# September 2026 the driver turned out to hang the board during probe,
# and a driver that hangs at boot cannot be debugged from a board that
# never finishes booting. Everything else the TEE subsystem needs is the
# same either way and stays here rather than being written twice.
#
# Every symbol below was read out of the tree at rpi-6.6.y before it was
# written here, and two of them are worth the reading:
#
#   drivers/tee/Kconfig         menuconfig TEE, tristate
#                                 depends on HAVE_ARM_SMCCC ...
#                                 select CRYPTO, CRYPTO_SHA1,
#                                        DMA_SHARED_BUFFER, GENERIC_ALLOCATOR
#   drivers/tee/optee/Kconfig   config OPTEE, tristate
#                                 depends on HAVE_ARM_SMCCC && MMU

# --- the subsystem ------------------------------------------------------
# The driver, CONFIG_OPTEE, is in tee-builtin.cfg or tee-modular.cfg.
CONFIG_TEE=y

# --- what TEE selects, asserted rather than requested -------------------
# These four are selected by TEE and cannot be asked for from a fragment.
# They are here so that ./go kconfig checks the consequence: a future
# defconfig that drops DMA_SHARED_BUFFER would take the TEE subsystem
# with it, and the first sign of that would otherwise be a board with no
# /dev/tee0 and a kernel that built cleanly.
#
# CRYPTO and CRYPTO_SHA1 carry prompts of their own, so those two are
# ordinary requests and pass unremarked. The other two are promptless,
# and the paragraph above is not what ./go ksym reads: the marker has to
# sit on the line directly above the symbol, where the script prints the
# real selectors beside the claim so it can be checked rather than
# believed. Stating the reason in prose and not in the form the tool
# parses is how this fragment failed its own check on Sunday.
CONFIG_CRYPTO=y
CONFIG_CRYPTO_SHA1=y
# consequence: selected by CONFIG_TEE, drivers/tee/Kconfig
CONFIG_DMA_SHARED_BUFFER=y
# consequence: selected by CONFIG_TEE, drivers/tee/Kconfig
CONFIG_GENERIC_ALLOCATOR=y

# --- what is deliberately off ------------------------------------------
# OPTEE_INSECURE_LOAD_IMAGE lets the driver load the BL32 image from the
# root filesystem at probe time, as firmware. It is exactly the opposite
# of what this project is about: the secure world would then be a file
# the normal world hands over, rather than an image the boot chain placed
# before Linux existed.
#
# Its own help text points at the Trusted Firmware-A threat model, and
# docs/THREAT-MODEL.md here already has a long list of what this board
# does not enforce. Adding a supported path for loading the secure world
# out of the normal world's filesystem would make that list longer for no
# gain: TF-A on the Pi 3 puts OP-TEE in the FIP, which is where it
# belongs.
# CONFIG_OPTEE_INSECURE_LOAD_IMAGE is not set
