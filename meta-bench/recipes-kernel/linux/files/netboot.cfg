# Project 4: what a diskless root needs from the kernel.
#
# Six options, every one of them checked against the kernel's own Kconfig in
# 6.6 rather than written from memory. That habit came from Project 15,
# where three plausible-looking symbols turned out not to exist and survived
# review, CI and a 178 minute build before ./go kconfig caught them.
#
# Two of these are =y for the same reason twice, and it is worth stating
# because it is the circular dependency that defines netbooting: a module
# lives in the root filesystem, the root filesystem is on the network, and
# the network needs a driver. A driver built as a module cannot be loaded
# in order to reach the place it is stored.
#
# The kernel says so itself in one of these cases. ROOT_NFS is declared
# "depends on NFS_FS=y && IP_PNP", and that "=y" inside a depends line is
# unusual enough in Kconfig to be worth noticing: it is how Kconfig says
# "this one cannot be a module".

# The client, built in rather than modular for the reason above.
CONFIG_NFS_FS=y

# Version 3. The kernel's nfsroot handles v3 best, and /etc/exports and the
# nfsroot= option in cmdline.txt name it explicitly at the other two
# corners of the same triangle.
CONFIG_NFS_V3=y

# Mount the root over NFS at all.
CONFIG_ROOT_NFS=y

# IP autoconfiguration in the kernel, before userspace exists. This is a
# second DHCP exchange, separate from the one the boot ROM did: the ROM's
# lease is not handed on, and seeing two DHCPDISCOVER lines in the dnsmasq
# journal is correct rather than a retry.
CONFIG_IP_PNP=y
CONFIG_IP_PNP_DHCP=y

# The Raspberry Pi 3B+ Ethernet. It is a Microchip LAN7515, driven by
# lan78xx, and it hangs off the internal USB hub rather than being on the
# SoC. Built in for the same circular reason as NFS_FS: a module here is a
# kernel that cannot reach the modules.
#
# This is the option that makes the fragment board-specific. A Pi 4 uses
# bcmgenet and a Pi 3B uses smsc95xx, so a netboot image for either of
# those needs a different line here.
CONFIG_USB_LAN78XX=y
