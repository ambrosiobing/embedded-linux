# Project 17: what a Bluetooth Low Energy gateway needs from the kernel.
#
# Opt in, like router.cfg and rt.cfg, and built in rather than modular for
# the same reason router.cfg gives at length: core-image-minimal installs
# no kernel modules at all, so a driver built as a module is a driver that
# exists in the build tree and is absent from the image. That has cost this
# bench two rounds of debugging already, once for brcmfmac and once for
# spidev, and the symptom both times was hardware that is present and a
# dmesg with no line for it anywhere.
#
# Every symbol below was read out of the tree at rpi-6.6.y before it was
# written here. That is not ceremony: three symbols in router.cfg were
# invented from the names of source files, and all three were silent
# no-ops until a build finally compiled a kernel and ./go kconfig said so.

# --- the stack ---------------------------------------------------------
# net/bluetooth/Kconfig declares BT with "menuconfig", which is an ordinary
# symbol with a menu attached, so it can be set from a fragment.
CONFIG_BT=y

# Both halves of a dual-mode controller. LE is what this project uses, and
# BR/EDR stays because the CYW43455 is one chip doing both and because
# turning it off is a separate experiment with its own measurement.
CONFIG_BT_LE=y
CONFIG_BT_BREDR=y

# --- the transport -----------------------------------------------------
# The Pi's radio is not a USB dongle. It hangs off a UART, so the path is
# serdev -> hci_uart -> the Broadcom vendor protocol, and every link in
# that chain has to be present at boot rather than loadable later.
CONFIG_SERIAL_DEV_BUS=y
CONFIG_SERIAL_DEV_CTRL_TTYPORT=y
CONFIG_BT_HCIUART=y
CONFIG_BT_HCIUART_H4=y
CONFIG_BT_HCIUART_BCM=y

# The next two have no prompt. drivers/bluetooth/Kconfig declares BT_BCM as
# a bare tristate that BT_HCIUART_BCM selects, and BT_HCIUART_SERDEV as a
# bool that defaults to y once SERIAL_DEV_BUS and BT_HCIUART are set. A
# fragment cannot ask for either of them, and that is exactly why they are
# written here: ./go kconfig checks the consequence of the three lines
# above, so a future defconfig that drops SERIAL_DEV_BUS is caught here
# rather than on a board whose hci0 never appears.
CONFIG_BT_HCIUART_SERDEV=y
CONFIG_BT_BCM=y

# --- what a gateway does not need --------------------------------------
# Three BR/EDR profiles that a sensor gateway has no use for. They are the
# serial port emulation, the Ethernet encapsulation and the human interface
# device profile; a project that pairs a keyboard or a headset turns them
# back on, and this file is where it would say so.
# CONFIG_BT_RFCOMM is not set
# CONFIG_BT_BNEP is not set
# CONFIG_BT_HIDP is not set

# --- debugging ---------------------------------------------------------
# The management socket that btmon reads is part of BT itself and needs no
# option. debugfs does need one, and it is what answers "what does the
# controller actually think it is doing" when the D-Bus layer says only
# that a connection failed.
CONFIG_BT_DEBUGFS=y
