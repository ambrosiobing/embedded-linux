# Project 15: what a gateway with a cellular uplink needs from the kernel.
#
# Everything here is =y rather than =m on purpose, and the reason is
# Project 1. core-image-minimal installs no kernel modules at all, so a
# driver built as a module is a driver that is present in the build tree
# and absent from the image. That cost two rounds of debugging on wlan0:
# the firmware was there, the hardware was there, and dmesg had no line for
# the driver anywhere because nobody had asked for the module package.
#
# On a router the modem drivers and the packet filter are not optional
# extras that might be loaded later. Building them in removes the whole
# class of failure, at the cost of a slightly larger kernel image, which on
# a mains-powered box with an SD card is not a cost worth counting.

# --- the modem over USB -----------------------------------------------
# The SIM7600E-H enumerates as a composite device: five serial ports
# through option, plus a QMI control channel and a raw-IP network
# interface through qmi_wwan.
CONFIG_USB_SERIAL=y
CONFIG_USB_SERIAL_WWAN=y
CONFIG_USB_SERIAL_OPTION=y
CONFIG_USB_USBNET=y
CONFIG_USB_NET_QMI_WWAN=y
CONFIG_USB_WDM=y

# The RNDIS and ECM compositions are the fallback if AT+CUSBPIDSWITCH is
# ever set to 9011 or 9018. Modules, because they are the path not taken:
# present for a recovery session, not carried in the boot image.
CONFIG_USB_NET_CDCETHER=m
CONFIG_USB_NET_RNDIS_HOST=m

# --- the packet path ---------------------------------------------------
CONFIG_NETFILTER=y
CONFIG_NETFILTER_ADVANCED=y
CONFIG_NF_CONNTRACK=y
CONFIG_NF_NAT=y
CONFIG_NF_TABLES=y
CONFIG_NF_TABLES_INET=y
CONFIG_NF_TABLES_IPV4=y
CONFIG_NF_TABLES_IPV6=y
CONFIG_NFT_CT=y
CONFIG_NFT_NAT=y
CONFIG_NFT_MASQ=y

# Three symbols that used to be here are gone: NFT_CHAIN_NAT, NFT_RT and
# NFT_EXTHDR. They were invented from the names of the source files, and
# `./go kconfig` caught all three as MISMATCH on the first build that
# actually compiled a kernel.
#
# What is true in 6.6, from net/netfilter/Makefile rather than from memory:
#
#   line 91   nft_rt.o and nft_exthdr.o are inside nf_tables-objs, so they
#             are compiled into nf_tables whenever NF_TABLES is set. The
#             MSS clamp, "tcp option maxseg size set rt mtu", is made of
#             those two files and therefore needs no option of its own.
#   line 136  obj-$(CONFIG_NFT_NAT) += nft_chain_nat.o, so the nat chain
#             type arrives with NFT_NAT above.
#
# net/netfilter/Kconfig defines none of the three. Writing them into a
# fragment is a silent no-op, which is the exact failure the kernel check
# exists to find: the build succeeds, the option is absent, and you learn
# about it on the board.

# Forwarding, and the conntrack accounting that makes "nft list ruleset"
# and conntrack -L worth reading during a failover test.
CONFIG_NF_CONNTRACK_PROCFS=y
CONFIG_NF_CONNTRACK_EVENTS=y
CONFIG_NF_CONNTRACK_TIMESTAMP=y

# --- the second uplink --------------------------------------------------
# A USB wireless adapter as a client uplink, so that this bench can have
# two uplinks at once and the failover can actually be measured. The part
# is a TP-Link TL-WN823N v2/v3, USB 2357:0109, a Realtek RTL8192EU.
#
# rtl8xxxu is in tree and lists this device explicitly: not merely in the
# id table but with "case 0x2357: if (id->idProduct == 0x0109) untested =
# 0;", so the driver itself records that somebody tested this exact part.
# No out-of-tree driver, no DKMS.
#
# A module rather than built in, unlike everything above it. The adapter is
# a stopgap for a missing Ethernet cable rather than part of the board, and
# a module is honest about that: unplug it and nothing in the kernel image
# is carrying weight for hardware that is not there.
CONFIG_RTL8XXXU=m

# --- the access point --------------------------------------------------
# brcmfmac is a FullMAC part, so AP mode lives in the chip's firmware and
# the host side only needs cfg80211 to be able to ask for it.
CONFIG_CFG80211_WEXT=y
