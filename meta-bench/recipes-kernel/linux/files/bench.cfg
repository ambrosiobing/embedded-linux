# Options the later bench projects need, switched on once here.
#
# Each line has to earn its place: if no project in this repository uses it,
# it does not belong in the fragment.

# GPIO character device. libgpiod v2 speaks only to this interface, and the
# deprecated v1 ioctls are off so that nothing in the image can quietly use
# the old sysfs-era path. (Projects 1, 4, 7)
CONFIG_GPIO_CDEV=y
# CONFIG_GPIO_CDEV_V1 is not set

# Industrial I/O, with buffering and triggers, for the sensor projects.
# (Projects 9, 13, 16)
CONFIG_IIO=y
CONFIG_IIO_BUFFER=y
CONFIG_IIO_KFIFO_BUF=y
CONFIG_IIO_TRIGGER=y
CONFIG_IIO_SYSFS_TRIGGER=y

# Raw SPI and I2C access from user space, for bring-up before a driver
# exists. (Projects 3, 5, 6, 11)
#
# Built in, not modules. Until Friday 9 October 2026 these were =m with
# the reasoning that debugging tools should not be part of the running
# system. That reasoning never held: a module reaches a board only if an
# image installs it, and no image here installs kernel-modules except the
# kiosk, so i2c-dev.ko and spidev.ko were built for every image and
# shipped to none. i2c-tools IS in the base image, so i2cget existed on
# every board and failed with "Could not open file /dev/i2c-1", which
# reads as a wiring fault. Found by wiring an ADXL345 to a Pi 3B+ and
# running the first probe; the diagnosis is in
# projects/05-iio-adxl345/docs/hardware.md.
#
# The check that proves this: on a freshly flashed image whose config.txt
# carries dtparam=i2c_arm=on, "ls /dev/i2c-1" exists with no modprobe.
# It failed on Friday 9 October 2026 and must not fail again.
CONFIG_SPI_SPIDEV=y
CONFIG_I2C_CHARDEV=y

# Let the running kernel report its own configuration, at /proc/config.gz.
# This is what makes the kernel-fragment criterion checkable on the board
# rather than only in a build tree: a build that is a complete sstate hit
# never compiles the kernel and leaves no .config to inspect. Costs a few
# kilobytes of compressed data in the kernel image. (Every project)
CONFIG_IKCONFIG=y
CONFIG_IKCONFIG_PROC=y

# Tracing, for the latency measurements in the later projects. Cheap when idle.
# (Projects 8, 15)
CONFIG_FTRACE=y
CONFIG_FUNCTION_TRACER=y
CONFIG_DYNAMIC_FTRACE=y
CONFIG_PREEMPT_TRACER=y

# The PREEMPT_RT symbol belongs to Project 8, which builds its own
# kernel; it is
# deliberately absent here so that this image stays comparable to stock.
