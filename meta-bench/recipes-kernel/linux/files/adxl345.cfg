# Project 5: what the out-of-tree ADXL345 driver needs, and the in-tree
# driver it is measured against.
#
# The IIO core, buffers and kfifo are already in bench.cfg and are not
# repeated here. This fragment adds two things: the regmap bus glue the
# driver builds on, and mainline's own ADXL345 driver, which is here on
# purpose rather than by oversight.
#
# EVERY SYMBOL BELOW IS A CLAIM THAT NEEDS CHECKING BEFORE THE BUILD.
#
#     ./go ksym -f adxl345
#
# That reports MISSING for a symbol this tree does not declare, and
# "consequence" for one that has no prompt and is selected by something
# else. Both answers matter here, because THREE of the symbols below are
# genuinely promptless and asking for one directly is a lie that kconfig
# accepts silently.
#
# This comment said "one" until the command was actually run, on the
# build host on Saturday 17 October 2026 against the 6.6.63 tree, 20854
# declarations indexed. CONFIG_ADXL345 was the one that had been thought
# about. CONFIG_REGMAP_I2C and CONFIG_REGMAP_SPI are the two that had
# not, and they are the two this driver cannot work without.
#
# AND A MODULE IS NOT A PACKAGE. Every =m here produces a .ko that Yocto
# packages separately and installs only if an image names it. See
# bench-adxl345-image.bb, which names all five, and decision 75, which
# this repository wrote after losing a board to exactly that gap twice.

# The two halves of the seam. The driver's core reaches the part only
# through a struct regmap, and these are what turn a bus into one.
#
# NEITHER LINE IS A REQUEST, and that was measured rather than known.
# Both symbols are promptless: `./go ksym -f adxl345` on Saturday 17
# October 2026 reported REGMAP_I2C selected from 63 places in the tree
# and REGMAP_SPI from 37, and no fragment can set either. They are kept
# here because they are the requirement, and because a fragment with no
# line for them is a fragment that cannot be checked at all: `./go
# kconfig -f adxl345` reads these lines against the .config the build
# produced, and that is the only check in this repository that can say
# whether the symbols are really on.
#
# The marker names the mechanism rather than a path, so ./go ksym
# reports the claim as unchecked. That is the honest answer: the script
# can verify that a named Kconfig file selects the symbol, which says
# nothing about whether the driver in that file is enabled in THIS
# image. Naming one to make the check go quiet would be the kind of
# claim this repository has been removing all week.
#
# The evidence that they are on is the board, dated: the modules
# bench-adxl345-core, -i2c and -spi loaded on the 6.6.63 image of Friday
# 9 October 2026 and the part bound and read gravity, so
# devm_regmap_init_i2c resolved at modprobe. An absent REGMAP_I2C is an
# unknown symbol at insmod, not a quiet degradation.
# consequence: promptless, selected by whichever in-tree driver wants a
# consequence: regmap bus; verified per build by ./go kconfig -f adxl345
CONFIG_REGMAP_I2C=y
# consequence: promptless, same as REGMAP_I2C directly above
CONFIG_REGMAP_SPI=y

# The controllers themselves. I2C is the wiring this bench expects to use
# first; SPI is built because the driver supports both and a driver whose
# second bus is never compiled is a driver whose second bus does not work.
CONFIG_I2C_BCM2835=y
CONFIG_SPI_BCM2835=y

# MAINLINE'S DRIVER, DELIBERATELY ENABLED.
#
# This looks like a mistake and is the opposite of one. Project 5 writes
# its own ADXL345 driver, and the honest way to say anything about it is
# to compare it against the one the kernel already has, on the same board
# and the same afternoon.
#
# The two cannot fight. Mainline claims the compatible "adi,adxl345" and
# this project's driver claims "bench,adxl345", so only one of them can
# ever match a given device tree node and which one is decided by the
# overlay rather than by module load order. Changing one word in the
# overlay swaps the driver under test for its control.
#
# Both are modules, so neither is in the way when it is not wanted.
CONFIG_ADXL345_I2C=m
CONFIG_ADXL345_SPI=m

# consequence: promptless, selected by ADXL345_I2C and ADXL345_SPI in
# consequence: drivers/iio/accel/Kconfig
CONFIG_ADXL345=m

# The input-subsystem driver for the same part, off.
#
# This is not tidiness. drivers/iio/accel/Kconfig in 6.12 makes both
# ADXL345_I2C and ADXL345_SPI depend on INPUT_ADXL34X=n, so leaving the
# input driver enabled does not cause a conflict at runtime: it makes the
# two lines above unsatisfiable, and kconfig drops them without a word.
# The build then succeeds and the control this project is measured against
# is simply absent.
# CONFIG_INPUT_ADXL34X is not set
