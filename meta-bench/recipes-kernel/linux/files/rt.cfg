# Project 8: the variable, and nothing else.
#
# This fragment holds the one symbol the experiment is about. Everything
# the lab needs in order to measure it lives in rt-common.cfg and is applied
# to both arms. See that file for why the two were separated on
# 17 September 2026, and journal 57 for how the board found out.
#
# A file this short is the point. If a line is added here, the question to
# answer first is whether the control should have it too, and the answer is
# almost always yes.
#
# Two facts decide the shape of this file, and both were checked in the
# tree rather than assumed:
#
#   kernel/Kconfig.preempt:   config PREEMPT_RT
#                               depends on EXPERT && ARCH_SUPPORTS_RT
#   arch/arm64/Kconfig:       select ARCH_SUPPORTS_RT
#
# The second line exists in rpi-6.12.y and not in rpi-6.6.y, which is the
# whole reason kas/bench-rt.yml also moves PREFERRED_VERSION_linux-
# raspberrypi to 6.12. On 6.6 this fragment would be silently ignored: the
# symbol has no prompt, so kconfig drops it and the build succeeds with a
# kernel that is not preemptible. That is exactly the failure ./go kconfig
# exists to catch.
#
# EXPERT is the other half of that dependency and it is NOT here. It lives
# in rt-common.cfg so that both arms are built with the same options
# unhidden, because an arm that can see options the other cannot is a
# second variable.

# PREEMPT_RT lives in a choice, so the other three members have to be named
# off explicitly. Without these lines the fragment still works, because
# kconfig resolves the choice, but ./go kconfig would have nothing to
# compare against and a silently unselected PREEMPT_RT would look the same
# as a correctly built one.
#
# These three stay here rather than in rt-common.cfg for the obvious
# reason: the control is CONFIG_PREEMPT, and a fragment that turned it off
# on both arms would leave the control with no preemption model at all.
# CONFIG_PREEMPT_NONE is not set
# CONFIG_PREEMPT_VOLUNTARY is not set
# CONFIG_PREEMPT is not set
CONFIG_PREEMPT_RT=y
