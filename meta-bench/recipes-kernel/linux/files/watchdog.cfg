# Project 19: the hardware watchdog on the Raspberry Pi SoC.
#
# A/B rollback needs two independent ways for a bad slot to lose, because
# the two failures look nothing alike.
#
# The counter in uboot.env handles a slot that boots and then fails its
# health check: something runs, something notices, the board reboots, and
# the boot script decrements on the way back in. That mechanism needs
# userspace to be alive enough to fail.
#
# It does nothing at all for a slot whose kernel hangs before systemd can
# fail anything. Nothing runs to record the failure, nothing reboots the
# board, and the counter stays exactly where it was. The board stops, and
# an unattended board that has stopped is indistinguishable from one that
# was switched off.
#
# The watchdog closes that hole from underneath. systemd opens
# /dev/watchdog0 and pets it from PID 1, a kernel that stops scheduling
# stops the petting, the SoC resets the board, and the boot script
# decrements the counter as it would after any other reboot. Three hangs
# and the slot is out of attempts, with no cooperation from the slot.
#
# THE TIMEOUT IS CLAMPED BY THE HARDWARE, not chosen by us. This watchdog
# counts in PM_WDOG ticks and saturates a little short of 16 seconds, so a
# request for anything longer is silently reduced to roughly 15. That is
# why systemd is configured at 14 rather than at a round 30: a request the
# hardware cannot honour does not fail, it is quietly rounded down, and a
# configuration file claiming 30 would be describing a watchdog that does
# not exist.
#
# WATCHDOG is a menu and WATCHDOG_CORE is the leaf the driver registers
# with. Naming only the driver leaves both unset and the driver with it.
# That is the failure Project 2 met on this bench with the wireless menu:
# merge_config.sh drops an option whose menu is closed and says nothing,
# the build succeeds, and the only sign is a device node that never
# appears. Both gates are therefore named here even though a defconfig may
# already carry them, because a fragment that depends on a defconfig is a
# fragment that breaks on the next rebase without a message.
CONFIG_WATCHDOG=y
CONFIG_WATCHDOG_CORE=y
CONFIG_WATCHDOG_SYSFS=y
CONFIG_BCM2835_WDT=y
