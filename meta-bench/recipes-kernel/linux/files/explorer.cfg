# Project 6: the eleven drivers the Explorer 700 overlay binds.
#
# EVERY SYMBOL BELOW WAS CHECKED AGAINST THE 6.6 SOURCE BEFORE IT WAS
# WRITTEN, and the check is in
# projects/06-explorer700/docs/evidence/kconfig-check.txt. Run it again
# against the tree that will actually be built:
#
#     ./go ksym -f explorer
#
# A fragment line naming a symbol nobody declares is silently ignored: the
# build succeeds, the option is absent, and the board disagrees a week
# later. This repository has paid for that once already with three invented
# netfilter symbols that survived review, CI and a 178 minute build.
#
# WHY EVERYTHING HERE IS =y AND NOT =m
#
# This is a deliberate departure from iio.cfg next door, which builds its
# sensor drivers as modules. The argument is the one in the skill file: use
# =y where the driver is not optional, and keep =m for things that
# genuinely are.
#
# On this image nothing is optional. The product is one overlay that binds
# eleven peripherals, and a driver missing from the rootfs makes its device
# vanish with no message anywhere. Worse, the Raspberry Pi 3 defconfig
# builds the two BUS CONTROLLERS as modules:
#
#     CONFIG_I2C_BCM2835=m
#     CONFIG_SPI_BCM2835=m
#
# so an image that named every driver and forgot the controllers would have
# no I2C bus and no SPI bus, and four of the five I2C parts would be
# invisible at once. Project 8 lost a flash and a boot to exactly that
# shape: it asked for kernel-module-spidev and not for the controller
# spidev attaches to.
#
# Building in costs kernel size on one image and removes the entire class
# of failure, along with about fifteen kernel-module-* lines that
# bench-explorer-image would otherwise have to get right. That recipe
# therefore names none, and says why.
#
# The whole fragment is opt in behind BENCH_EXPLORER_KERNEL for the usual
# reason: no other image in this repository wants a DRM core built into its
# kernel for a display it does not have.

# --- the two bus controllers ------------------------------------------
#
# Named first because they are the ones the defconfig makes modules and
# because everything else here is useless without them.
CONFIG_I2C_BCM2835=y
CONFIG_SPI_BCM2835=y

# --- I2C1: the four addressed parts -----------------------------------

# DS3231 at 0x68. The driver is named for the DS1307 and covers the
# DS3231 too, which is why the vendor manual tells you to modprobe
# rtc-ds1307 for a chip with the other name on it.
CONFIG_RTC_DRV_DS1307=y

# PCF8574 at 0x20. Eight quasi-bidirectional lines, and the gpiochip that
# the joystick, the second LED and the buzzer all hang off by phandle.
CONFIG_GPIO_PCF857X=y

# PCF8591 at 0x48, an 8-bit ADC and DAC that appears under hwmon. Not in
# the Pi defconfig at all, so this line is load bearing.
CONFIG_SENSORS_PCF8591=y

# The pressure sensor at 0x76. BMP280 is in the defconfig as a module and
# BMP280_I2C IS NOT THERE AT ALL, which would give a driver core with no
# bus glue: the symbol exists, the part never probes, and nothing says so.
# That is the single most likely silent failure in this fragment.
#
# The same driver handles the BMP180, so if the board turns out to carry
# one of those the change is in the overlay's compatible string and not
# here.
CONFIG_BMP280=y
CONFIG_BMP280_I2C=y

# --- SPI0: the OLED ---------------------------------------------------
#
# NOT ssd1307fb. FB_SSD1307 is "depends on FB && I2C" in the 6.6 Kconfig
# and is registered with module_i2c_driver, so it has no SPI probe path
# and cannot bind this panel whatever the device tree says. The project
# specification names it; the board makes it impossible. See
# projects/06-explorer700/docs/DESIGN.md.
#
# So the binding is DRM. CONFIG_DRM is =m in the Pi 3 defconfig and is
# forced built-in here, which is what lets the two ssd130x symbols be
# built in as well: Kconfig will not allow a =y symbol to depend on a =m
# one, and the quiet result of trying is a fragment line that does not
# take effect.
#
# vc4 is deliberately not touched. It stays a module and is simply not
# installed, which is correct for a board using an OLED and no HDMI.
CONFIG_DRM=y
CONFIG_DRM_SSD130X=y
CONFIG_DRM_SSD130X_SPI=y

# And the shim that gives a DRM device a /dev/fb node. Without it the
# panel works and there is no framebuffer, so con2fbmap has nothing to
# map and the specification's "put the console on the OLED" step is not
# reachable. It is a bool with default y under DRM, so it may well come
# back as already set; that is the check doing its job rather than a
# redundant line.
CONFIG_DRM_FBDEV_EMULATION=y

# --- 1-Wire: the DS18B20 ----------------------------------------------
#
# The probe ships loose and plugs into a three-pin header, so this stack
# can be perfectly correct and find nothing. w1_master_slave_count is
# what tells the two cases apart.
CONFIG_W1=y
CONFIG_W1_MASTER_GPIO=y
CONFIG_W1_SLAVE_THERM=y

# --- the IR receiver --------------------------------------------------
#
# RC_CORE is already =y in the defconfig and IR_GPIO_CIR is =m. The
# decoders are the part worth naming: without one, ir-keytable -t reports
# raw pulse timings and never a scancode, which reads like a broken
# receiver rather than a missing decoder.
#
# Three protocols because the remote is unknown. NEC is the common one,
# RC-5 and RC-6 cover most of the rest, and they cost a few kilobytes
# each.
CONFIG_RC_CORE=y
CONFIG_RC_DECODERS=y
CONFIG_IR_GPIO_CIR=y
CONFIG_IR_NEC_DECODER=y
CONFIG_IR_RC5_DECODER=y
CONFIG_IR_RC6_DECODER=y

# LIRC gives /dev/lirc0, which is how you capture a protocol nobody has
# decoded yet. Not needed for the acceptance criteria and kept because
# the one remote on this bench may speak none of the three above.
CONFIG_LIRC=y

# --- LEDs -------------------------------------------------------------
#
# Both already set in the defconfig, LEDS_GPIO as =y. Named because the
# overlay's default trigger is a string that fails silently: a
# linux,default-trigger naming a trigger the kernel does not have leaves
# the LED with the default trigger and no complaint.
CONFIG_LEDS_GPIO=y
CONFIG_LEDS_TRIGGER_HEARTBEAT=y

# --- input: the joystick and the buzzer -------------------------------
#
# Neither is in the Pi defconfig.
#
# GPIO_POLLED and not plain KEYBOARD_GPIO: four of the five joystick
# contacts are on the I2C expander, and those are sleeping lines. A
# driver using the atomic GPIO accessors refuses them at probe. Both
# gpio-keys-polled and gpio-beeper use the sleeping accessors.
CONFIG_KEYBOARD_GPIO_POLLED=y
CONFIG_INPUT_GPIO_BEEPER=y

# evdev is what makes any of the above reachable as /dev/input/eventN.
# Already =y in the defconfig; named because every acceptance criterion
# that involves the joystick, the buzzer or the remote goes through it.
CONFIG_INPUT_EVDEV=y
