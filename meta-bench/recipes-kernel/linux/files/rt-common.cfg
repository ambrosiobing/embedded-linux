# Project 8: everything the latency lab needs that is NOT the variable.
#
# This fragment is applied to BOTH arms of the experiment, the real-time
# kernel and its control. rt.cfg holds the one thing they differ by.
#
# WHY THIS FILE EXISTS, which is a correction rather than a design.
#
# Until 17 September 2026 there was one fragment, added only when
# BENCH_RT_KERNEL was "1". kas/bench-rt-generic.yml sets it to "0", so the
# control received none of it: not NO_HZ_FULL, not RCU_NOCB_CPU, not
# CPU_ISOLATION, not the debug options held off, not the default governor.
# The control was the stock Raspberry Pi kernel and the file's own header
# said the two "differ in one symbol, CONFIG_PREEMPT_RT".
#
# The board found it, and only because a serial console was attached.
# Adding isolcpus=3 nohz_full=3 rcu_nocbs=3 to cmdline.txt produced
#
#     Housekeeping: nohz unsupported. Build with CONFIG_NO_HZ_FULL
#     Unknown kernel command line parameters "nohz_full=3 rcu_nocbs=3"
#
# on the console and nowhere else. Over ssh it is invisible. Journal 57,
# decision 88.
#
# The grouping in the old file was by topic, which is how a person writes a
# config. An experiment needs it grouped by whether a symbol is the
# variable or the background, and that is the only rule this split follows.
#
# WHAT THE STOCK KERNEL IS NOW.
#
# Both arms carry this file, so neither is stock any more. That is the
# point. The stock arm is not lost: eight rows of it were measured on
# 17 September and are kept in results/2026-09-17_5ec99fd-dirty, so the
# three-way comparison is available without a third kernel build.
#
#     stock           -> tuned generic     what the isolation config buys
#     tuned generic   -> real-time         what PREEMPT_RT alone buys
#     stock           -> real-time         what adopting the lot buys
#
# To rebuild the stock arm, set BENCH_RT_LAB = "0" in a kas file. Nothing
# else changes.

# --- threaded interrupt handlers ---------------------------------------
# Threaded handlers are what makes a device driver preemptible by the
# real-time task, and what the threadirqs boot parameter switches on for
# the generic comparison row.
#
# This line was written as a request and is not one. kernel/irq/Kconfig
# declares the symbol as a bare promptless bool, so kconfig ignores any
# fragment that sets it; arch/arm64/Kconfig selects it unconditionally, so
# it is y on this architecture whatever the fragment says. The line stayed
# because the check is still worth making: an arm64 that stopped selecting
# it would take the threadirqs row away, and nothing else would say so.
# consequence: promptless, selected by arch/arm64/Kconfig
CONFIG_IRQ_FORCED_THREADING=y

# --- timers and the isolated core --------------------------------------
CONFIG_HIGH_RES_TIMERS=y

# NO_HZ_FULL and NO_HZ_IDLE are the same choice. isolcpus alone leaves the
# scheduler tick running on the isolated core at 100 or 250 Hz, which is a
# periodic interruption of exactly the task being measured.
#
# Absent from the control until 17 September, which is why every row of the
# generic half labelled isolated=yes was isolated only in the sense that
# the scheduler stayed off CPU 3. The tick did not.
# CONFIG_NO_HZ_IDLE is not set
CONFIG_NO_HZ_FULL=y
CONFIG_CPU_ISOLATION=y

# RCU callbacks are the third member of that set. Without RCU_NOCB_CPU the
# grace-period work still runs on CPU3 in softirq context, and it arrives in
# bursts, which is the shape that shows up in the tail of the histogram
# rather than in the mean.
CONFIG_RCU_NOCB_CPU=y

# --- the frequency governor --------------------------------------------
# The default governor is a boot-time property; the matrix changes it from
# user space per run. Defaulting to performance means the "governor:
# ondemand" rows are the ones that had to be asked for, rather than the
# other way round.
#
# This one had a visible consequence before the split. The control booted
# ondemand and the real-time kernel would have booted performance, so the
# two "unchanged governor" rows at the top of each half would have compared
# different governors with nothing in the table saying so.
CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE=y

# --- EXPERT ------------------------------------------------------------
# PREEMPT_RT depends on EXPERT && ARCH_SUPPORTS_RT, so the real-time arm
# needs this. It is here rather than in rt.cfg so that both arms are built
# with the same set of options unhidden: EXPERT changes nothing on its own,
# but it changes what kconfig may ask about, and an experiment in which one
# arm can see options the other cannot is one variable more than it claims.
CONFIG_EXPERT=y

# --- what is deliberately off ------------------------------------------
# These are debugging aids that add work to precisely the paths being
# measured. DEBUG_PREEMPT instruments every preempt_disable and defaults to
# y on a preemptible kernel, so it has to be asked for off rather than left
# alone. The lockup detectors run a per-CPU watchdog thread, and one of
# those threads on the isolated core is a periodic visitor to the core that
# is supposed to have none.
#
# LOCKUP_DETECTOR itself has no prompt: lib/Kconfig.debug declares it as a
# plain bool that the two prompted detectors select. Naming all three is
# deliberate. The two are the request, the third is the consequence, and
# ./go kconfig checking the consequence is what catches a later defconfig
# that turns one of them back on through some other path.
#
# These belong here rather than in rt.cfg for the reason the whole split
# exists: a debug option that instruments the measured path on one arm and
# not the other is a difference in the instrument, not in the subject.
# CONFIG_DEBUG_PREEMPT is not set
# CONFIG_SOFTLOCKUP_DETECTOR is not set
# CONFIG_HARDLOCKUP_DETECTOR is not set
# consequence: promptless, selected by the two detectors above
# CONFIG_LOCKUP_DETECTOR is not set

# bench.cfg leaves FUNCTION_TRACER on for every image, and it stays on here.
# Dynamic ftrace patches the call sites out when no tracer is attached, so
# the idle cost is a nop per function, and Project 9 needs this same kernel
# to be traceable. If a reviewer asks what ftrace costs, the answer is
# another row in the table built with it off, not an argument.
