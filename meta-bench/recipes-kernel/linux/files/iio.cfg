# Project 10: the sensors of the X-NUCLEO-IKS4A1, and the hrtimer trigger.
#
# The IIO core, buffers, kfifo and the sysfs trigger are already in
# bench.cfg and are not repeated here. What this adds is the four drivers,
# the one trigger type bench.cfg does not carry, and the filesystem that
# trigger is created through.
#
# EVERY SYMBOL BELOW IS A CLAIM THAT NEEDS CHECKING BEFORE THE BUILD.
#
# These names come from the project specification, which was written
# against "Linux 6.x" in general, and a driver that exists upstream is
# not a driver that exists in this tree under this name.
#
# THE VERSION IS NOT 6.12.93 AND THIS COMMENT SAID IT WAS. Only
# kas/bench-rt.yml pins a kernel, PREFERRED_VERSION_linux-raspberrypi
# = "6.12.%", and it targets raspberrypi4-64. Every other
# configuration, this one included, takes the meta-raspberrypi
# default, which is 6.6.63 for raspberrypi3-64: 20854 symbol
# declarations indexed by ./go ksym on Saturday 24 October 2026,
# matching the figure adxl345.cfg recorded against the same tree. A
# version number written into a fragment is a claim about whichever
# kas file loads it, so do not write one; run the check instead:
#
#     ./go ksym -f iio
#
# That reports MISSING for a symbol the tree does not declare and
# "consequence" for one that has no prompt and is selected by something
# else. Both are useful answers here and neither is visible after a build.
#
# AND A MODULE IS NOT A PACKAGE. Everything marked =m below produces a
# .ko that Yocto puts in its own kernel-module-* package, which the image
# has to name or the driver is simply absent from the rootfs with no
# error anywhere. Project 8 lost a flash and a boot to exactly that: a
# spidev with no controller, because the image asked for the interface and
# not for the driver behind it. The matching lines are in
# bench-iio-image.bb and the two files are edited together.

# The IMU: accelerometer and gyroscope as two IIO devices sharing one
# hardware FIFO and one INT1 line. The FIFO is the point of the project,
# so this one is not optional.
CONFIG_IIO_ST_LSM6DSX=m

# The bus half is the one that actually binds a device, so it is named
# here rather than left implicit, where a reader would reasonably think
# the parent alone was enough. It is not settable: ./go ksym -f iio
# refused it on Tuesday 21 October 2026, because the symbol has no
# prompt and no fragment line can request one.
#
# The marker names its Kconfig file, which is what lets the checker
# contradict it rather than merely accept it. A claim naming no file
# is reported as unchecked, and that is the mildest message the script
# produces, so it reads as a complaint about the comment rather than
# about the reader.
#
# This marker was reported unchecked twice on Saturday 24 October 2026
# while naming the file the whole time. The cause was in the checker
# and not here: it replaced its record of the claim on every
# consequence line instead of appending, so a claim wrapped across
# several lines was truncated to its tail and a path on any earlier
# line was discarded before it could be matched. Both markers in
# adxl345.cfg happen to carry their path last, which is why the defect
# had never shown. It now appends, with both directions proved in
# tests/kernel-symbols-test.sh, so the path may sit on any line.
# consequence: promptless, selected by IIO_ST_LSM6DSX when I2C is on,
# consequence: which CONFIG_I2C_BCM2835 below makes true, and read back
# consequence: as =m from the built .config on Saturday 24 October
# consequence: 2026, in drivers/iio/imu/st_lsm6dsx/Kconfig
CONFIG_IIO_ST_LSM6DSX_I2C=m

# The magnetometer. It has no FIFO of its own, which is why it is the
# device the hrtimer trigger is demonstrated on.
CONFIG_IIO_ST_MAGN_3AXIS=m
CONFIG_IIO_ST_MAGN_I2C_3AXIS=m

# The pressure sensor. The LPS22DF entry is a recent addition to this
# driver, so this is the symbol most likely to come back MISSING on an
# older tree; if it does, the part is listed as unsupported in the
# inventory rather than quietly dropped.
CONFIG_IIO_ST_PRESS=m
CONFIG_IIO_ST_PRESS_I2C=m

# The humidity and temperature sensor, which is NOT an IIO device. sht4x
# is a hwmon driver, so it appears under /sys/class/hwmon and in
# sensors(1) and never under /sys/bus/iio/devices. A program enumerating
# IIO devices will not find it and will not say so.
#
# The lowercase x is the symbol's real spelling.
CONFIG_SENSORS_SHT4x=m

# The hrtimer trigger, which fires at a fixed rate from the kernel and is
# the middle of the three paths this project measures. It is created
# through configfs, not sysfs, which is why CONFIG_CONFIGFS_FS is here:
# without it the trigger type exists and there is no way to instantiate
# one, and the symptom is an empty /sys/kernel/config with no error.
#
# The IIO_SW_TRIGGER symbol is the framework both software triggers need.
# bench.cfg already sets CONFIG_IIO_SYSFS_TRIGGER, so this may come back
# as a consequence rather than a request. That is a fine answer and it is
# recorded as one.
CONFIG_IIO_SW_TRIGGER=y
CONFIG_IIO_HRTIMER_TRIGGER=m
CONFIG_CONFIGFS_FS=y

# The I2C controller the sensors are actually on.
#
# Named explicitly even though the BSP defconfig sets it, for the reason
# in the header: an interface without its controller is the failure this
# repository has now paid for twice. If ./go ksym reports it as already
# set, that is the check doing its job rather than a redundant line.
CONFIG_I2C_BCM2835=y
